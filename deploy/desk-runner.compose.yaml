# The agent desk runner — its own application, on its own VM, on purpose.
#
# This file replaces deploy/shell-runner.compose.yaml. The desk (a Cloud
# Hypervisor microVM per agent — docs/agent-desk.md) is the only agent
# execution surface now; the bubblewrap shell runner is retired with it, and
# the BUNKHOUSE_SHELL_URL / BUNKHOUSE_SHELL_TOKEN pair on the main stack is
# superseded by BUNKHOUSE_DESK_URL / BUNKHOUSE_DESK_TOKEN.
#
# WHY THIS RUNS ON A DEDICATED DESK HOST VM, AND NOT THE DOKPLOY VM:
#
# Booting a microVM needs KVM, and KVM inside a Hyper-V guest needs nested
# virtualisation. Enabling that requires powering the L1 VM off and disabling
# Dynamic Memory — static RAM only, because ballooning wrecks nested load.
# Doing that to the VM that holds the provider keys, the session secret and
# the database is the wrong trade, and it is the same argument the shell
# runner's header made before this file existed:
#
#   The obvious fix — grant all three to web, worker and voice-agent — is the
#   wrong trade. Those are the containers that execute model-directed code and
#   drive a browser across the open web, on a host that also runs other
#   applications. Removing the outer confinement from the most exposed
#   containers in order to enable an inner sandbox is backwards.
#
# Same shape here: the capability (this time /dev/kvm and a reconfigured host
# VM rather than CAP_SYS_ADMIN and unconfined seccomp) lives in a process
# whose entire job is to boot desks and relay what happens on them. It holds
# no database URL, no provider keys, no session secret, and publishes no port.
# Two checks bound what it can be asked to do: a bearer token compared in
# constant time, and disk paths that must resolve inside the agent-disks root.
#
# WHY THIS SERVICE HAS NET_ADMIN, AND WHY THAT IS NOT A WIDENING:
#
# A desk's network does not exist until this process makes it. For each desk
# it creates a TAP device, addresses it, and puts a per-desk iptables rule set
# in front of it that DNATs ALL guest HTTP and HTTPS into the egress proxy,
# pins DNS to one resolver, and DROPS everything else — including 443/udp,
# because Chromium tries QUIC first and would otherwise route straight past a
# TCP-only proxy without ever telling anyone (docs/agent-desk.md §3.11).
#
# That is the enforcement §3.22 depends on. The agent has a ROOT SHELL inside
# the guest, so any control that lives inside the guest is a control the agent
# can remove. Putting the rules on the host side of the TAP is what makes them
# rules rather than requests — and NET_ADMIN is the capability that costs.
#
# It is granted to THIS container and no other, for the same reason /dev/kvm
# is: this process holds no database URL, no provider keys and no session
# secret, and publishes no port. It fails closed on both arms — a host without
# KVM serves no desks, and a container that cannot create the tap or write the
# rules serves no desks either, rather than booting one with an open route.
#
# EXPECT A PERFORMANCE TAX. Cloud Hypervisor here is L2 virtualisation —
# a VMM inside a Hyper-V guest. The sub-second boot figures published for
# these VMMs are measured on bare metal; nested will be slower. Measure on
# the real host before promising resume latency anywhere in the UI or docs.
#
# HOW TO DEPLOY IT
#
#   1. Prepare the dedicated desk host VM on the Hyper-V host (NOT the
#      Dokploy VM — that is the whole point). From an admin PowerShell:
#
#        # VM must be OFF to toggle nested virtualisation
#        Stop-VM -Name 'bunkhouse-desk'
#        Set-VMProcessor -VMName 'bunkhouse-desk' -ExposeVirtualizationExtensions $true
#
#        # Dynamic Memory must be off; ballooning wrecks nested load
#        Set-VMMemory -VMName 'bunkhouse-desk' -DynamicMemoryEnabled $false -StartupBytes 32GB
#
#        # Nested guests need this for their own networking
#        Get-VMNetworkAdapter -VMName 'bunkhouse-desk' | Set-VMNetworkAdapter -MacAddressSpoofing On
#
#        Start-VM -Name 'bunkhouse-desk'
#
#   2. Verify inside the guest before deploying anything:
#
#        ls -l /dev/kvm && grep -cE 'vmx|svm' /proc/cpuinfo
#
#      No /dev/kvm means step 1 did not take (or the CPU lacks VT-x/EPT or
#      AMD-V/NPT); nothing below will work until it does.
#   3. Add the desk host to Dokploy as a remote server, then create a new
#      Compose application ON THAT SERVER, compose type "Docker Compose",
#      pointed at this file. (Plain `docker compose -f ... up -d` on the desk
#      host works identically if you would rather not run it through Dokploy.)
#   4. Set the environment: BUNKHOUSE_TAG, and BUNKHOUSE_DESK_TOKEN — a secret
#      you invent; the same value goes on the main stack so the two ends agree.
#   5. On the main bunkhouse stack, set:
#         BUNKHOUSE_DESK_URL=http://bunkhouse-desk:8080
#         BUNKHOUSE_DESK_TOKEN=<the same secret>
#      With those unset, agents have no machine at all: the desk abilities
#      fail closed, exactly as the product already behaves without Chromium.

networks:
  dokploy-network:
    external: true

volumes:
  # LOCAL to the desk host, on purpose — unlike agent workspaces, which are an
  # NFS export shared with the main stack, this is disk-level state: the golden
  # base image plus one copy-on-write overlay per agent. A block-level overlay
  # over NFS is the wrong tool (locking, latency, and a corrupted overlay on a
  # dropped mount); workspace files still flow through the web tier and its
  # NFS-backed volume, not through here.
  #
  # BUNKHOUSE_AGENT_DISKS_HOST must name a directory on a REFLINK-CAPABLE
  # filesystem — XFS (mkfs.xfs -m reflink=1) or Btrfs. Each desk's disk is a
  # `cp --reflink=auto` clone of the golden base: on XFS that is a block-
  # sharing clone measured at 0.04s, and on ext4 the same command silently
  # falls back to copying the whole image — about 5GB per desk, per boot. It
  # still works; it just turns an instant lease into a minute of disk I/O.
  agent-disks:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${BUNKHOUSE_AGENT_DISKS_HOST:-/mnt/agent-disks}
  # The one governed hole in the per-agent boundary: the company shared
  # folder, mounted into each guest via virtio-fs (docs/agent-desk.md §3.12).
  shared-folder:

services:
  desk-runner:
    # Built from the app image plus the VMM tooling (cloud-hypervisor + qemu-img)
    # that the app image deliberately omits — see deploy/desk-runner.Dockerfile.
    # This is the only service that maps /dev/kvm and spawns microVMs.
    build:
      context: ..
      dockerfile: deploy/desk-runner.Dockerfile
      args:
        BUNKHOUSE_IMAGE: ${BUNKHOUSE_IMAGE:-ghcr.io/braedonsaunders/bunkhouse}
        BUNKHOUSE_TAG: ${BUNKHOUSE_TAG:-latest}
    # The guest disk assets (base.raw + vmlinux) are produced by
    # deploy/desk-image/build-golden-image.sh and live in the agent-disks
    # volume; per-desk overlays are raw reflink copies of base.raw.
    command:
      - sh
      - -c
      - NODE_OPTIONS=--conditions=react-server exec apps/web/node_modules/.bin/tsx apps/web/scripts/desk-runner.mts
    # The one capability this whole file exists to grant.
    devices:
      - /dev/kvm
      # NET_ADMIN is permission to configure a tap; /dev/net/tun is the thing
      # that actually creates one. Without this node the runner starts, refuses
      # every desk, and reports `ip tuntap add: open: No such file or
      # directory` — correct, fail-closed, and baffling until you know that the
      # capability and the device are two separate grants.
      - /dev/net/tun
    # The second one, and the header explains the trade: without it there is
    # no TAP and no DNAT, and therefore no enforced egress.
    cap_add:
      - NET_ADMIN
    environment:
      NODE_ENV: production
      PORT: '8080'
      # Deliberately the whole environment. No database, no Redis, no provider
      # keys, no auth secret: this process needs a token, two paths, and the
      # ports its egress proxy listens on, and what it does not have cannot be
      # taken from it.
      BUNKHOUSE_DESK_TOKEN: ${BUNKHOUSE_DESK_TOKEN}
      BUNKHOUSE_AGENT_DISKS: /data/agent-disks
      BUNKHOUSE_SHARED_FOLDER: /data/shared
      # The DNAT targets. Same two values on the proxy below, which shares
      # this container's network namespace — so these are ports on the very
      # address each tap already carries, and the redirect never leaves it.
      BUNKHOUSE_EGRESS_HTTP_PORT: '3129'
      BUNKHOUSE_EGRESS_HTTPS_PORT: '3130'
      # The one resolver a guest may reach; 53 is DNAT'd to it and nothing
      # else in the guest can choose otherwise.
      BUNKHOUSE_GUEST_DNS: 1.1.1.1
    volumes:
      - agent-disks:/data/agent-disks
      - shared-folder:/data/shared
    networks:
      dokploy-network:
        # An alias with no underscore in it. Docker service names contain one,
        # underscores are illegal in hostnames, and a strict server refuses the
        # Host header — which is exactly how every call recording was silently
        # rejected by object storage before this was understood.
        aliases:
          - bunkhouse-desk
    # Ports, and why this is not simply "none".
    #
    # When the runner shares an overlay network with the web tier it needs no
    # published port at all, and BUNKHOUSE_DESK_BIND should stay at its default
    # — 127.0.0.1, reachable from nowhere but this host.
    #
    # A DEDICATED desk host (spec §3.5) is a different machine from the one
    # running the app, and deliberately so: the nested-virtualisation trade is
    # wrong to make on the VM holding the provider keys and the database. Such
    # a host is not on that overlay network, so the app can only reach it
    # across the LAN, which means publishing this port. Set
    # BUNKHOUSE_DESK_BIND to that host's LAN address (never 0.0.0.0) and point
    # BUNKHOUSE_DESK_URL at it. What guards the port then is the same thing
    # that guarded the retired shell runner: a constant-time bearer token, and
    # a service that refuses to start without one.
    ports:
      - '${BUNKHOUSE_DESK_BIND:-127.0.0.1}:8080:8080'
    restart: always
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Every byte a guest sends leaves through here. The desk-runner DNAT's all
  # guest traffic at the TAP device into this proxy as it creates each tap, so
  # the guest cannot opt out — there is no proxy setting to unset, and it
  # covers every application including the ones that ignore HTTP_PROXY
  # (docs/agent-desk.md §3.11). That placement is the point: the agent has a
  # root shell inside the guest, so enforcement has to live outside the
  # boundary the agent controls or it is not enforcement.
  #
  # IT SHARES THE DESK-RUNNER'S NETWORK NAMESPACE, deliberately. The taps live
  # in that namespace, so the DNAT target is then an address the tap already
  # carries: the redirect is a local delivery that never crosses the docker
  # bridge, and — the part that matters — the target cannot move. A separate
  # container gets a new IP whenever it restarts, which would leave every
  # already-installed DNAT rule pointing at nothing. It also means the proxy
  # sees each flow's real source address, which is the guest's, which is how
  # a decision in the audit log names the desk that made it.
  #
  # Two listeners answer the redirect, one per pre-DNAT port, because node
  # cannot read SO_ORIGINAL_DST: the port a guest asked for is carried by
  # which listener the flow landed on. 3128 stays for explicit proxying.
  egress-proxy:
    image: ${BUNKHOUSE_IMAGE:-ghcr.io/braedonsaunders/bunkhouse}:${BUNKHOUSE_TAG:-latest}
    command:
      - sh
      - -c
      - NODE_OPTIONS=--conditions=react-server exec apps/web/node_modules/.bin/tsx apps/web/scripts/egress-proxy.mts
    environment:
      NODE_ENV: production
      PORT: '3128'
      BUNKHOUSE_EGRESS_HTTP_PORT: '3129'
      BUNKHOUSE_EGRESS_HTTPS_PORT: '3130'
    # Not `networks:` — the two are mutually exclusive, and the namespace is
    # the point. No ports either: guests reach it only through the DNAT rules
    # the desk-runner installs, and nothing else needs to reach it at all.
    network_mode: service:desk-runner
    depends_on:
      - desk-runner
    restart: always
