# bunkhouse stack for Dokploy (project "bunkhouse").
#
# Deployed as a SWARM STACK (composeType "stack") pinned to the manager node:
# placement puts every service beside dokploy-traefik, and ingress is wired by
# Dokploy managed domains (Traefik file provider) — one hostname to web:3000,
# one to livekit:7880 over wss. The site's HA edge Traefik pair terminates
# TURN/TLS for LIVEKIT_TURN_DOMAIN and forwards plaintext to the manager's
# dedicated host port, which maps to LiveKit's embedded TURN listener.
# The GitHub deploy workflow bumps BUNKHOUSE_TAG and triggers compose.deploy.
#
# Database, app Redis, and object storage are EXISTING shared services, never
# bundled containers — point BUNKHOUSE_DB_URL, BUNKHOUSE_REDIS_URL, and the
# APPKIT_STORAGE_* variables at whatever your infrastructure already runs. The
# media plane (LiveKit + SIP) uses that same external HA Redis service, with
# real API keys and the public address announced to SIP peers. SIP/RTP ports
# publish in host mode on the manager — the public ingress a carrier or PBX
# points at.

networks:
  # Media services share this stack-private overlay. The voice agent must see
  # the same LiveKit node address that LiveKit advertises internally; routing
  # it through the public TURN endpoint from a different overlay creates an
  # unrouteable hairpin in Docker Swarm.
  default:
    driver: overlay
  dokploy-network:
    external: true
  # The shared services network, where the database, Redis, and object storage
  # this stack talks to already live. Create it out of band; it is not managed
  # here, and its name is the only thing this file needs to know about it.
  infra-net:
    external: true

volumes:
  # Agent workspaces belong on shared network storage like every other durable
  # volume — nothing bunkhouse keeps should sit on a swarm node's local disk,
  # or it vanishes when the task reschedules. The key is deliberately NOT
  # 'agent-homes': that name already exists as a local volume, and Docker
  # reuses an existing volume verbatim, driver options and all.
  #
  # Both values come from the deployment's environment, which the deploy
  # workflow writes from repository variables before every deploy — so this
  # file names no particular company's storage, and nothing has to be set by
  # hand. Deploying outside that workflow means setting them yourself.
  agent-workspaces:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${BUNKHOUSE_NFS_ADDR},nfsvers=4,rw,hard,timeo=600"
      device: "${BUNKHOUSE_NFS_EXPORT}"

services:
  web:
    image: ghcr.io/braedonsaunders/bunkhouse:${BUNKHOUSE_TAG:-latest}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: '3000'
      BUNKHOUSE_DB_URL: ${BUNKHOUSE_DB_URL}
      BUNKHOUSE_SUPER_URL: ${BUNKHOUSE_SUPER_URL}
      BUNKHOUSE_REDIS_URL: ${BUNKHOUSE_REDIS_URL}
      APPKIT_SECRET: ${APPKIT_SECRET}
      # One public URL for browsers, server actions, and the voice agent alike
      # (containers reach the public host by hairpin, like the CI runner does).
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      # Authentication: session signing, public origin, and the first-boot
      # owner (consumed only while no credentialed account exists).
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      APP_URL: ${APP_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # Object storage (files ledger: deliverables, mail attachments).
      APPKIT_STORAGE_ENDPOINT: ${APPKIT_STORAGE_ENDPOINT}
      APPKIT_STORAGE_ACCESS_KEY_ID: ${APPKIT_STORAGE_ACCESS_KEY_ID}
      APPKIT_STORAGE_SECRET_ACCESS_KEY: ${APPKIT_STORAGE_SECRET_ACCESS_KEY}
      APPKIT_STORAGE_BUCKET: ${APPKIT_STORAGE_BUCKET:-bunkhouse}
      BUNKHOUSE_AGENT_HOMES: /data/agent-homes
      # Where agent execution actually happens. This VM cannot host microVMs
      # (nested virtualisation is deliberately off here — see
      # deploy/desk-runner.compose.yaml), so the desk runner is its own
      # application on the dedicated desk host and this is how to reach it.
      # Unset, agents have no machine: the desk abilities fail closed, exactly
      # as browsing does without Chromium.
      BUNKHOUSE_DESK_URL: ${BUNKHOUSE_DESK_URL:-}
      BUNKHOUSE_DESK_TOKEN: ${BUNKHOUSE_DESK_TOKEN:-}
    volumes:
      - agent-workspaces:/data/agent-homes
    networks:
      - dokploy-network
      - infra-net
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname==dokploy-mgr
      resources:
        limits:
          memory: 2g
      restart_policy:
        condition: any
        delay: 5s

  # Background worker: mailbox sync, duty scheduler, run executor, approval
  # resume, memory consolidation. Same image, no ingress; web owns migrations.
  worker:
    image: ghcr.io/braedonsaunders/bunkhouse:${BUNKHOUSE_TAG:-latest}
    command: ["sh", "-c", "NODE_OPTIONS=--conditions=react-server exec apps/web/node_modules/.bin/tsx apps/web/scripts/worker.mts"]
    environment:
      NODE_ENV: production
      BUNKHOUSE_DB_URL: ${BUNKHOUSE_DB_URL}
      BUNKHOUSE_SUPER_URL: ${BUNKHOUSE_SUPER_URL}
      BUNKHOUSE_REDIS_URL: ${BUNKHOUSE_REDIS_URL}
      APPKIT_SECRET: ${APPKIT_SECRET}
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      APP_URL: ${APP_URL}
      APPKIT_STORAGE_ENDPOINT: ${APPKIT_STORAGE_ENDPOINT}
      APPKIT_STORAGE_ACCESS_KEY_ID: ${APPKIT_STORAGE_ACCESS_KEY_ID}
      APPKIT_STORAGE_SECRET_ACCESS_KEY: ${APPKIT_STORAGE_SECRET_ACCESS_KEY}
      APPKIT_STORAGE_BUCKET: ${APPKIT_STORAGE_BUCKET:-bunkhouse}
      BUNKHOUSE_AGENT_HOMES: /data/agent-homes
      # Where agent execution actually happens. This VM cannot host microVMs
      # (nested virtualisation is deliberately off here — see
      # deploy/desk-runner.compose.yaml), so the desk runner is its own
      # application on the dedicated desk host and this is how to reach it.
      # Unset, agents have no machine: the desk abilities fail closed, exactly
      # as browsing does without Chromium.
      BUNKHOUSE_DESK_URL: ${BUNKHOUSE_DESK_URL:-}
      BUNKHOUSE_DESK_TOKEN: ${BUNKHOUSE_DESK_TOKEN:-}
    volumes:
      - agent-workspaces:/data/agent-homes
    networks:
      - dokploy-network
      - infra-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname==dokploy-mgr
      resources:
        limits:
          memory: 1g
      restart_policy:
        condition: any
        delay: 5s

  # The voice agent: registers against LiveKit and answers every call room.
  voice-agent:
    image: ghcr.io/braedonsaunders/bunkhouse:${BUNKHOUSE_TAG:-latest}
    command: ["sh", "-c", "NODE_OPTIONS=--conditions=react-server exec apps/web/node_modules/.bin/tsx apps/web/scripts/voice-agent.mts start"]
    environment:
      NODE_ENV: production
      BUNKHOUSE_DB_URL: ${BUNKHOUSE_DB_URL}
      BUNKHOUSE_SUPER_URL: ${BUNKHOUSE_SUPER_URL}
      BUNKHOUSE_REDIS_URL: ${BUNKHOUSE_REDIS_URL}
      APPKIT_SECRET: ${APPKIT_SECRET}
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      APP_URL: ${APP_URL}
      APPKIT_STORAGE_ENDPOINT: ${APPKIT_STORAGE_ENDPOINT}
      APPKIT_STORAGE_ACCESS_KEY_ID: ${APPKIT_STORAGE_ACCESS_KEY_ID}
      APPKIT_STORAGE_SECRET_ACCESS_KEY: ${APPKIT_STORAGE_SECRET_ACCESS_KEY}
      APPKIT_STORAGE_BUCKET: ${APPKIT_STORAGE_BUCKET:-bunkhouse}
      BUNKHOUSE_AGENT_HOMES: /data/agent-homes
      # Where agent execution actually happens. This VM cannot host microVMs
      # (nested virtualisation is deliberately off here — see
      # deploy/desk-runner.compose.yaml), so the desk runner is its own
      # application on the dedicated desk host and this is how to reach it.
      # Unset, agents have no machine: the desk abilities fail closed, exactly
      # as browsing does without Chromium.
      BUNKHOUSE_DESK_URL: ${BUNKHOUSE_DESK_URL:-}
      BUNKHOUSE_DESK_TOKEN: ${BUNKHOUSE_DESK_TOKEN:-}
    volumes:
      - agent-workspaces:/data/agent-homes
    networks:
      - default
      - dokploy-network
      - infra-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname==dokploy-mgr
      resources:
        limits:
          # A call is the heaviest thing this image runs: the worker process
          # plus a job process per live call, each carrying the plugins and
          # the VAD's onnx runtime. Headroom here is cheaper than a worker the
          # swarm kills mid-ring — see numIdleProcesses in voice-agent.mts.
          memory: 3g
      restart_policy:
        condition: any
        delay: 5s

  livekit:
    image: livekit/livekit-server:latest
    # Signalling enters through Dokploy. Direct TCP/UDP media stays published
    # in host mode for the fast path. The HA edge terminates TURN/TLS on public
    # 443 and forwards the decrypted stream to the dedicated host port below.
    # LiveKit and its embedded TURN server must advertise an address they can
    # both reach inside Swarm. Use the stable service VIP configured for this
    # deployment; using the manager's LAN address forces an unsupported
    # same-container NAT hairpin and breaks every relayed call. Keep the value
    # explicit because DNS is not guaranteed to be ready when Swarm starts the
    # container, and an entrypoint-time lookup can crash-loop the media plane.
    environment:
      # One config body rather than flags plus environment: the media settings
      # below have no flag equivalents, and splitting the configuration across
      # both is how a setting ends up silently not applying.
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses:
          - 0.0.0.0
        rtc:
          tcp_port: 7881
          udp_port: 7882
          node_ip: ${LIVEKIT_NODE_IP:-10.0.12.2}
        turn:
          enabled: true
          domain: ${LIVEKIT_TURN_DOMAIN:-bunkhouse-turn.cloud.rassaun.com}
          # The HA edge terminates TLS and maps public 443 to host port 5349.
          # external_tls keeps the client-facing URI on turns:443.
          tls_port: 443
          external_tls: true
          ttl_seconds: 300
          # A bounded pool keeps Swarm's host-published port set operable while
          # still allowing many simultaneous bundled WebRTC transports.
          relay_range_start: 30000
          relay_range_end: 30049
          # LiveKit blocks TURN relays to private targets by default. Permit
          # only this task's SFU address, not the rest of the private network.
          allow_restricted_peer_cidrs:
            - "${LIVEKIT_NODE_IP:-10.0.12.2}/32"
        redis:
          address: ${BUNKHOUSE_MEDIA_REDIS_ADDRESS}
          password: ${BUNKHOUSE_MEDIA_REDIS_PASSWORD}
          db: ${BUNKHOUSE_MEDIA_REDIS_DB}
        keys:
          ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
        logging:
          level: info
    networks:
      - default
      - dokploy-network
    ports:
      - target: 7881
        published: 7881
        protocol: tcp
        mode: host
      - target: 7882
        published: 7882
        protocol: udp
        mode: host
      # Plaintext TURN after TLS termination at the HA edge. This is not a
      # public listener: only the edge routes bunkhouse-turn SNI to it.
      - target: 443
        published: 5349
        protocol: tcp
        mode: host
      # TURN advertises the node address for relay candidates. Publish the
      # matching relay sockets or ICE checks reach the host and die before the
      # embedded TURN server can receive them.
      # Swarm defaults short-form ranges to the routing mesh. TURN needs the
      # packets on the node that owns the LiveKit task, so every relay socket
      # is published explicitly in host mode.
      - target: 30000
        published: 30000
        protocol: udp
        mode: host
      - target: 30001
        published: 30001
        protocol: udp
        mode: host
      - target: 30002
        published: 30002
        protocol: udp
        mode: host
      - target: 30003
        published: 30003
        protocol: udp
        mode: host
      - target: 30004
        published: 30004
        protocol: udp
        mode: host
      - target: 30005
        published: 30005
        protocol: udp
        mode: host
      - target: 30006
        published: 30006
        protocol: udp
        mode: host
      - target: 30007
        published: 30007
        protocol: udp
        mode: host
      - target: 30008
        published: 30008
        protocol: udp
        mode: host
      - target: 30009
        published: 30009
