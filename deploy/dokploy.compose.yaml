# bunkhouse stack for Dokploy (project "bunkhouse").
#
# Deployed as a SWARM STACK (composeType "stack") pinned to the manager node:
# placement puts every service beside dokploy-traefik, and ingress is wired by
# Dokploy managed domains (Traefik file provider) — one hostname to web:3000,
# one to livekit:7880 over wss. The GitHub deploy workflow bumps BUNKHOUSE_TAG
# and triggers compose.deploy.
#
# Database, app Redis, and object storage are EXISTING shared services, never
# bundled containers — point BUNKHOUSE_DB_URL, BUNKHOUSE_REDIS_URL, and the
# APPKIT_STORAGE_* variables at whatever your infrastructure already runs. The
# media plane (LiveKit + SIP) runs here with its own private Redis, exactly as
# in local dev, but with real API keys and the public address announced to SIP
# peers. SIP/RTP ports publish in host mode on the manager — the public ingress
# a carrier or PBX points at.

networks:
  dokploy-network:
    external: true
  # The shared services network, where the database, Redis, and object storage
  # this stack talks to already live. Create it out of band; it is not managed
  # here, and its name is the only thing this file needs to know about it.
  infra-net:
    external: true

volumes:
  # Agent workspaces belong on shared network storage like every other durable
  # volume — nothing bunkhouse keeps should sit on a swarm node's local disk,
  # or it vanishes when the task reschedules. The key is deliberately NOT
  # 'agent-homes': that name already exists as a local volume, and Docker
  # reuses an existing volume verbatim, driver options and all.
  #
  # Both values come from the deployment's environment, which the deploy
  # workflow writes from repository variables before every deploy — so this
  # file names no particular company's storage, and nothing has to be set by
  # hand. Deploying outside that workflow means setting them yourself.
  agent-workspaces:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${BUNKHOUSE_NFS_ADDR},nfsvers=4,rw,hard,timeo=600"
      device: "${BUNKHOUSE_NFS_EXPORT}"

services:
  web:
    image: ghcr.io/braedonsaunders/bunkhouse:${BUNKHOUSE_TAG:-latest}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: '3000'
      BUNKHOUSE_DB_URL: ${BUNKHOUSE_DB_URL}
      BUNKHOUSE_SUPER_URL: ${BUNKHOUSE_SUPER_URL}
      BUNKHOUSE_REDIS_URL: ${BUNKHOUSE_REDIS_URL}
      APPKIT_SECRET: ${APPKIT_SECRET}
      # One public URL for browsers, server actions, and the voice agent alike
      # (containers reach the public host by hairpin, like the CI runner does).
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      # Authentication: session signing, public origin, and the first-boot
      # owner (consumed only while no credentialed account exists).
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      APP_URL: ${APP_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # Object storage (files ledger: deliverables, mail attachments).
      APPKIT_STORAGE_ENDPOINT: ${APPKIT_STORAGE_ENDPOINT}
      APPKIT_STORAGE_ACCESS_KEY_ID: ${APPKIT_STORAGE_ACCESS_KEY_ID}
      APPKIT_STORAGE_SECRET_ACCESS_KEY: ${APPKIT_STORAGE_SECRET_ACCESS_KEY}
      APPKIT_STORAGE_BUCKET: ${APPKIT_STORAGE_BUCKET:-bunkhouse}
      BUNKHOUSE_AGENT_HOMES: /data/agent-homes
      # Where a shell command actually runs. The swarm cannot give a container
      # what bubblewrap needs (see deploy/shell-runner.compose.yaml), so the
      # sandbox is its own Compose application and this is how to reach it.
      # Unset, agents run the shell in-process — right on a developer machine,
      # impossible here.
      BUNKHOUSE_SHELL_URL: ${BUNKHOUSE_SHELL_URL:-}
      BUNKHOUSE_SHELL_TOKEN: ${BUNKHOUSE_SHELL_TOKEN:-}
    volumes:
      - agent-workspaces:/data/agent-homes
    networks:
      - dokploy-network
      - infra-net
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname==dokploy-mgr
      resources:
        limits:
          memory: 2g
      restart_policy:
        condition: any
        delay: 5s

  # Background worker: mailbox sync, duty scheduler, run executor, approval
  # resume, memory consolidation. Same image, no ingress; web owns migrations.
  worker:
    image: ghcr.io/braedonsaunders/bunkhouse:${BUNKHOUSE_TAG:-latest}
    command: ["sh", "-c", "NODE_OPTIONS=--conditions=react-server exec apps/web/node_modules/.bin/tsx apps/web/scripts/worker.mts"]
    environment:
      NODE_ENV: production
      BUNKHOUSE_DB_URL: ${BUNKHOUSE_DB_URL}
      BUNKHOUSE_SUPER_URL: ${BUNKHOUSE_SUPER_URL}
      BUNKHOUSE_REDIS_URL: ${BUNKHOUSE_REDIS_URL}
      APPKIT_SECRET: ${APPKIT_SECRET}
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      APP_URL: ${APP_URL}
      APPKIT_STORAGE_ENDPOINT: ${APPKIT_STORAGE_ENDPOINT}
      APPKIT_STORAGE_ACCESS_KEY_ID: ${APPKIT_STORAGE_ACCESS_KEY_ID}
      APPKIT_STORAGE_SECRET_ACCESS_KEY: ${APPKIT_STORAGE_SECRET_ACCESS_KEY}
      APPKIT_STORAGE_BUCKET: ${APPKIT_STORAGE_BUCKET:-bunkhouse}
      BUNKHOUSE_AGENT_HOMES: /data/agent-homes
      # Where a shell command actually runs. The swarm cannot give a container
      # what bubblewrap needs (see deploy/shell-runner.compose.yaml), so the
      # sandbox is its own Compose application and this is how to reach it.
      # Unset, agents run the shell in-process — right on a developer machine,
      # impossible here.
      BUNKHOUSE_SHELL_URL: ${BUNKHOUSE_SHELL_URL:-}
      BUNKHOUSE_SHELL_TOKEN: ${BUNKHOUSE_SHELL_TOKEN:-}
    volumes:
      - agent-workspaces:/data/agent-homes
    networks:
      - dokploy-network
      - infra-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname==dokploy-mgr
      resources:
        limits:
          memory: 1g
      restart_policy:
        condition: any
        delay: 5s

  # The voice agent: registers against LiveKit and answers every call room.
  voice-agent:
    image: ghcr.io/braedonsaunders/bunkhouse:${BUNKHOUSE_TAG:-latest}
    command: ["sh", "-c", "NODE_OPTIONS=--conditions=react-server exec apps/web/node_modules/.bin/tsx apps/web/scripts/voice-agent.mts start"]
    environment:
      NODE_ENV: production
      BUNKHOUSE_DB_URL: ${BUNKHOUSE_DB_URL}
      BUNKHOUSE_SUPER_URL: ${BUNKHOUSE_SUPER_URL}
      BUNKHOUSE_REDIS_URL: ${BUNKHOUSE_REDIS_URL}
      APPKIT_SECRET: ${APPKIT_SECRET}
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      APP_URL: ${APP_URL}
      APPKIT_STORAGE_ENDPOINT: ${APPKIT_STORAGE_ENDPOINT}
      APPKIT_STORAGE_ACCESS_KEY_ID: ${APPKIT_STORAGE_ACCESS_KEY_ID}
      APPKIT_STORAGE_SECRET_ACCESS_KEY: ${APPKIT_STORAGE_SECRET_ACCESS_KEY}
      APPKIT_STORAGE_BUCKET: ${APPKIT_STORAGE_BUCKET:-bunkhouse}
      BUNKHOUSE_AGENT_HOMES: /data/agent-homes
      # Where a shell command actually runs. The swarm cannot give a container
      # what bubblewrap needs (see deploy/shell-runner.compose.yaml), so the
      # sandbox is its own Compose application and this is how to reach it.
      # Unset, agents run the shell in-process — right on a developer machine,
      # impossible here.
      BUNKHOUSE_SHELL_URL: ${BUNKHOUSE_SHELL_URL:-}
      BUNKHOUSE_SHELL_TOKEN: ${BUNKHOUSE_SHELL_TOKEN:-}
    volumes:
      - agent-workspaces:/data/agent-homes
    networks:
      - dokploy-network
      - infra-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname==dokploy-mgr
      resources:
        limits:
          # A call is the heaviest thing this image runs: the worker process
          # plus a job process per live call, each carrying the plugins and
          # the VAD's onnx runtime. Headroom here is cheaper than a worker the
          # swarm kills mid-ring — see numIdleProcesses in voice-agent.mts.
          memory: 3g
      restart_policy:
        condition: any
        delay: 5s

  livekit:
    image: livekit/livekit-server:latest
    # Signalling reaches this over Traefik on 443; media does not, and media is
    # what a call actually is. Two things have to be true, and getting one of
    # them wrong is silent: the agent still answers, and the caller hears
    # nothing at all.
    #
    # The address clients are told to send media to must be one they can route
    # to. `${PUBLIC_IP}` does not forward 7881/7882, and the server's own view
    # of itself is an overlay address meaningless outside the swarm — both were
    # advertised at one point and neither could be reached. It now advertises
    # the swarm node, which callers on this network can reach.
    #
    # And the media ports must publish in HOST mode, exactly as livekit-sip's
    # do. Ingress publishing puts them on the swarm routing mesh, which
    # source-NATs and load-balances — TCP survives that and ICE does not. On
    # the mesh, 7881/tcp answered while 7882/udp was a black hole: every
    # candidate pair failed with 8 STUN requests sent and 0 responses, on both
    # transports, on every call. Host mode is safe here because the service is
    # pinned to the one node whose address is advertised above.
    #
    # Verify after any change to this block, from a machine on the caller's
    # network — a STUN binding request to <node_ip>:7882/udp must come back:
    #   python3 -c "import socket,struct,os;s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM);s.settimeout(4);s.sendto(struct.pack('>HHI',1,0,0x2112A442)+os.urandom(12),('10.0.0.101',7882));print(s.recvfrom(2048)[1])"
    environment:
      # One config body rather than flags plus environment: the media settings
      # below have no flag equivalents, and splitting the configuration across
      # both is how a setting ends up silently not applying.
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses:
          - 0.0.0.0
        rtc:
          tcp_port: 7881
          udp_port: 7882
          # The address clients are told to send media to. Discovery is wrong
          # here: the only interface the server can see is its overlay address,
          # and the public address does not forward 7881/7882 — both were
          # advertised and neither could be reached, which is what "could not
          # establish pc connection" was. The swarm node is reachable on the
          # network callers are on, and answers on both ports once they publish
          # in host mode.
          #
          # WHO CAN CALL is decided entirely by this one line. It is the swarm
          # node's LAN address, so media works for callers on 10.0.0.0/24 and
          # for nobody else: a caller on another subnet or over the VPN reaches
          # the signalling (Traefik, 443) and then fails ICE, which is heard as
          # an agent who answers and never speaks. Verified from both sides —
          # 10.0.0.73 reaches 7881, this deployment's own callers on other
          # networks time out with "wait_pc_connection timed out", and LiveKit
          # logs every candidate pair failing with 0 responses.
          #
          # To let anyone else call: forward 7881/tcp and 7882/udp from the
          # public address to this node, then set LIVEKIT_NODE_IP to that
          # public address in the deployment environment. It is a variable
          # rather than a literal precisely so that opening the ports is the
          # only work — no code change, no rebuild.
          node_ip: ${LIVEKIT_NODE_IP:-10.0.0.101}
        redis:
          address: media-redis:6379
        keys:
          ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
        logging:
          level: info
    networks:
      - dokploy-network
    ports:
      - target: 7881
        published: 7881
        protocol: tcp
        mode: host
      - target: 7882
        published: 7882
        protocol: udp
        mode: host
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname==dokploy-mgr
      restart_policy:
        condition: any
        delay: 5s

  media-redis:
    image: redis:7-alpine
    networks:
      - dokploy-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname==dokploy-mgr
      restart_policy:
        condition: any
        delay: 5s

  # Recording. Every call the agent holds is meant to be kept as audio, and
  # none of them were: the application asked LiveKit for an egress on every
  # single call and there was no egress service in this deployment to answer.
  # LiveKit queues the request against a worker pool of zero, so it never
  # failed either — it timed out, per call, for as long as recording has
  # existed. Nothing needs configuring on the application side; the worker
  # simply had to exist.
  #
  # It joins the same Redis the media server and SIP use — that is how LiveKit
  # dispatches an egress to a worker — and writes straight to the company's
  # object storage from here, so the bytes never touch the application.
  livekit-egress:
    image: livekit/egress:latest
    environment:
      EGRESS_CONFIG_BODY: |
        redis:
          address: media-redis:6379
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://livekit:7880
        insecure: false
        logging:
          level: info
    # Room composite drives a headless Chrome, which needs to sandbox itself.
    cap_add:
      - SYS_ADMIN
    networks:
      - dokploy-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname==dokploy-mgr
      restart_policy:
        condition: any
        delay: 5s

  # SIP ingress — the public address a carrier trunk or PBX points at.
  livekit-sip:
    image: livekit/sip:latest
    environment:
      SIP_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://livekit:7880
        redis:
          address: media-redis:6379
        sip_port: 5060
        rtp_port: 10000-10019
        use_external_ip: true
        logging:
          level: info
    networks:
      - dokploy-network
    ports:
      - target: 5060
        published: 5060
        protocol: udp
        mode: host
      - target: 5060
        published: 5060
        protocol: tcp
        mode: host
      - target: 10000
        published: 10000
        protocol: udp
        mode: host
      - target: 10001
        published: 10001
        protocol: udp
        mode: host
      - target: 10002
        published: 10002
        protocol: udp
        mode: host
      - target: 10003
        published: 10003
        protocol: udp
        mode: host
      - target: 10004
        published: 10004
        protocol: udp
        mode: host
      - target: 10005
        published: 10005
        protocol: udp
        mode: host
      - target: 10006
        published: 10006
        protocol: udp
        mode: host
      - target: 10007
        published: 10007
        protocol: udp
        mode: host
      - target: 10008
        published: 10008
        protocol: udp
        mode: host
      - target: 10009
        published: 10009
        protocol: udp
        mode: host
      - target: 10010
        published: 10010
        protocol: udp
        mode: host
      - target: 10011
        published: 10011
        protocol: udp
        mode: host
      - target: 10012
        published: 10012
        protocol: udp
        mode: host
      - target: 10013
        published: 10013
        protocol: udp
        mode: host
      - target: 10014
        published: 10014
        protocol: udp
        mode: host
      - target: 10015
        published: 10015
        protocol: udp
        mode: host
      - target: 10016
        published: 10016
        protocol: udp
        mode: host
      - target: 10017
        published: 10017
        protocol: udp
        mode: host
      - target: 10018
        published: 10018
        protocol: udp
        mode: host
      - target: 10019
        published: 10019
        protocol: udp
        mode: host
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname==dokploy-mgr
      restart_policy:
        condition: any
        delay: 5s

  # Dev mail lab, matching local: Mailpit catches outbound, GreenMail offers
  # accept-anything IMAP/SMTP for wiring agents end to end. Internal only.
  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - dokploy-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname==dokploy-mgr
      restart_policy:
        condition: any
        delay: 5s

  greenmail:
    image: greenmail/standalone:latest
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled
    networks:
      - dokploy-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname==dokploy-mgr
      restart_policy:
        condition: any
        delay: 5s
