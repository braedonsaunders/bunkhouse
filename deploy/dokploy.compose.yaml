      - target: 10019
        published: 10019
        protocol: udp
        mode: host
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname==dokploy-mgr
      restart_policy:
        condition: any
        delay: 5s

  # Dev mail lab, matching local: Mailpit catches outbound, GreenMail offers
  # accept-anything IMAP/SMTP for wiring agents end to end. Internal only.
  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - dokploy-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname==dokploy-mgr
      restart_policy:
        condition: any
        delay: 5s

  greenmail:
    image: greenmail/standalone:latest
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled
    networks:
      - dokploy-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname==dokploy-mgr
      restart_policy:
        condition: any
        delay: 5s
