# bunkhouse stack for Dokploy (project "bunkhouse").
#
# Deployed as a SWARM STACK (composeType "stack") pinned to the manager node:
# placement puts every service beside dokploy-traefik, and ingress is wired by
# Dokploy managed domains (Traefik file provider) — one hostname to web:3000,
# one to livekit:7880 over wss. The GitHub deploy workflow bumps BUNKHOUSE_TAG
# and triggers compose.deploy.
#
# Database, app Redis, and object storage are EXISTING shared services, never
# bundled containers — point BUNKHOUSE_DB_URL, BUNKHOUSE_REDIS_URL, and the
# APPKIT_STORAGE_* variables at whatever your infrastructure already runs. The
# media plane (LiveKit + SIP) runs here with its own private Redis, exactly as
# in local dev, but with real API keys and the public address announced to SIP
# peers. SIP/RTP ports publish in host mode on the manager — the public ingress
# a carrier or PBX points at.

networks:
  dokploy-network:
    external: true
  # The shared services network, where the database, Redis, and object storage
  # this stack talks to already live. Create it out of band; it is not managed
  # here, and its name is the only thing this file needs to know about it.
  infra-net:
    external: true

volumes:
  # Agent workspaces belong on shared network storage like every other durable
  # volume — nothing bunkhouse keeps should sit on a swarm node's local disk,
  # or it vanishes when the task reschedules. The key is deliberately NOT
  # 'agent-homes': that name already exists as a local volume, and Docker
  # reuses an existing volume verbatim, driver options and all.
  #
  # Both values come from the deployment's environment, which the deploy
  # workflow writes from repository variables before every deploy — so this
  # file names no particular company's storage, and nothing has to be set by
  # hand. Deploying outside that workflow means setting them yourself.
  agent-workspaces:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${BUNKHOUSE_NFS_ADDR},nfsvers=4,rw,hard,timeo=600"
      device: "${BUNKHOUSE_NFS_EXPORT}"

services:
  web:
    image: ghcr.io/braedonsaunders/bunkhouse:${BUNKHOUSE_TAG:-latest}
    # The agent workspace runs every shell command inside a bubblewrap sandbox,
    # and bubblewrap has to build one before anything can run in it. Every
    # `run_shell` an agent tried failed at that step, so the whole workspace —
    # files, scripts, real work — was unusable, and the agents fell back to
    # leaving each other notes.
    #
    # CAP_SYS_ADMIN is granted and verified applied. It is NOT sufficient on
    # its own, and the rest of what is needed is measured, not assumed: with
    # the same image and the same probe on this host, `--cap-add SYS_ADMIN`
    # plus `--security-opt apparmor=unconfined,seccomp=unconfined` builds the
    # sandbox, and without them the container's docker-default profile refuses
    # it with "Failed to make / slave: Permission denied".
    #
    # The security_opt lines below are the ones that would lift it, and
    # `docker stack deploy` SILENTLY DROPS THEM — the deployed service reports
    # seccomp=<nil> apparmor=<nil> while cap_add came through. They are kept
    # because they are correct and would apply anywhere this compose is run
    # without swarm, but on this deployment they do nothing, and `run_shell`
    # stays broken until either the host's docker-default profile is changed
    # or agent shell work is isolated some other way than bubblewrap-in-a-
    # container. Verify with the ops workflow's checkSandbox rather than
    # assuming either way.
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: '3000'
      BUNKHOUSE_DB_URL: ${BUNKHOUSE_DB_URL}
      BUNKHOUSE_SUPER_URL: ${BUNKHOUSE_SUPER_URL}
      BUNKHOUSE_REDIS_URL: ${BUNKHOUSE_REDIS_URL}
      APPKIT_SECRET: ${APPKIT_SECRET}
      # One public URL for browsers, server actions, and the voice agent alike
      # (containers reach the public host by hairpin, like the CI runner does).
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      # Authentication: session signing, public origin, and the first-boot
      # owner (consumed only while no credentialed account exists).
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      APP_URL: ${APP_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # Object storage (files ledger: deliverables, mail attachments).
      APPKIT_STORAGE_ENDPOINT: ${APPKIT_STORAGE_ENDPOINT}
      APPKIT_STORAGE_ACCESS_KEY_ID: ${APPKIT_STORAGE_ACCESS_KEY_ID}
      APPKIT_STORAGE_SECRET_ACCESS_KEY: ${APPKIT_STORAGE_SECRET_ACCESS_KEY}
      APPKIT_STORAGE_BUCKET: ${APPKIT_STORAGE_BUCKET:-bunkhouse}
      BUNKHOUSE_AGENT_HOMES: /data/agent-homes
    volumes:
      - agent-workspaces:/data/agent-homes
    networks:
      - dokploy-network
      - infra-net
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname==dokploy-mgr
      resources:
        limits:
          memory: 2g
      restart_policy:
        condition: any
        delay: 5s

  # Background worker: mailbox sync, duty scheduler, run executor, approval
  # resume, memory consolidation. Same image, no ingress; web owns migrations.
  worker:
    image: ghcr.io/braedonsaunders/bunkhouse:${BUNKHOUSE_TAG:-latest}
    command: ["sh", "-c", "NODE_OPTIONS=--conditions=react-server exec apps/web/node_modules/.bin/tsx apps/web/scripts/worker.mts"]
    # The agent workspace runs every shell command inside a bubblewrap sandbox,
    # and bubblewrap has to build one before anything can run in it. Every
    # `run_shell` an agent tried failed at that step, so the whole workspace —
    # files, scripts, real work — was unusable, and the agents fell back to
    # leaving each other notes.
    #
    # CAP_SYS_ADMIN is granted and verified applied. It is NOT sufficient on
    # its own, and the rest of what is needed is measured, not assumed: with
    # the same image and the same probe on this host, `--cap-add SYS_ADMIN`
    # plus `--security-opt apparmor=unconfined,seccomp=unconfined` builds the
    # sandbox, and without them the container's docker-default profile refuses
    # it with "Failed to make / slave: Permission denied".
    #
    # The security_opt lines below are the ones that would lift it, and
    # `docker stack deploy` SILENTLY DROPS THEM — the deployed service reports
    # seccomp=<nil> apparmor=<nil> while cap_add came through. They are kept
    # because they are correct and would apply anywhere this compose is run
    # without swarm, but on this deployment they do nothing, and `run_shell`
    # stays broken until either the host's docker-default profile is changed
    # or agent shell work is isolated some other way than bubblewrap-in-a-
    # container. Verify with the ops workflow's checkSandbox rather than
    # assuming either way.
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    environment:
      NODE_ENV: production
      BUNKHOUSE_DB_URL: ${BUNKHOUSE_DB_URL}
      BUNKHOUSE_SUPER_URL: ${BUNKHOUSE_SUPER_URL}
      BUNKHOUSE_REDIS_URL: ${BUNKHOUSE_REDIS_URL}
      APPKIT_SECRET: ${APPKIT_SECRET}
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      APP_URL: ${APP_URL}
      APPKIT_STORAGE_ENDPOINT: ${APPKIT_STORAGE_ENDPOINT}
      APPKIT_STORAGE_ACCESS_KEY_ID: ${APPKIT_STORAGE_ACCESS_KEY_ID}
      APPKIT_STORAGE_SECRET_ACCESS_KEY: ${APPKIT_STORAGE_SECRET_ACCESS_KEY}
      APPKIT_STORAGE_BUCKET: ${APPKIT_STORAGE_BUCKET:-bunkhouse}
      BUNKHOUSE_AGENT_HOMES: /data/agent-homes
    volumes:
      - agent-workspaces:/data/agent-homes
    networks:
      - dokploy-network
      - infra-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname==dokploy-mgr
      resources:
        limits:
          memory: 1g
      restart_policy:
        condition: any
        delay: 5s

  # The voice agent: registers against LiveKit and answers every call room.
  voice-agent:
    image: ghcr.io/braedonsaunders/bunkhouse:${BUNKHOUSE_TAG:-latest}
    command: ["sh", "-c", "NODE_OPTIONS=--conditions=react-server exec apps/web/node_modules/.bin/tsx apps/web/scripts/voice-agent.mts start"]
    environment:
      NODE_ENV: production
      BUNKHOUSE_DB_URL: ${BUNKHOUSE_DB_URL}
      BUNKHOUSE_SUPER_URL: ${BUNKHOUSE_SUPER_URL}
      BUNKHOUSE_REDIS_URL: ${BUNKHOUSE_REDIS_URL}
      APPKIT_SECRET: ${APPKIT_SECRET}
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      APP_URL: ${APP_URL}
      APPKIT_STORAGE_ENDPOINT: ${APPKIT_STORAGE_ENDPOINT}
      APPKIT_STORAGE_ACCESS_KEY_ID: ${APPKIT_STORAGE_ACCESS_KEY_ID}
      APPKIT_STORAGE_SECRET_ACCESS_KEY: ${APPKIT_STORAGE_SECRET_ACCESS_KEY}
      APPKIT_STORAGE_BUCKET: ${APPKIT_STORAGE_BUCKET:-bunkhouse}
      BUNKHOUSE_AGENT_HOMES: /data/agent-homes
    volumes:
      - agent-workspaces:/data/agent-homes
    networks:
      - dokploy-network
      - infra-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname==dokploy-mgr
      resources:
        limits:
          # A call is the heaviest thing this image runs: the worker process
          # plus a job process per live call, each carrying the plugins and
          # the VAD's onnx runtime. Headroom here is cheaper than a worker the
          # swarm kills mid-ring — see numIdleProcesses in voice-agent.mts.
          memory: 3g
      restart_policy:
        condition: any
        delay: 5s

  livekit:
    image: livekit/livekit-server:latest
    # Signalling reaches this over Traefik on 443; media does not, and media is
    # what a call actually is. Two things had to be true and neither was:
    #
    # It advertised an address no client could reach. `${PUBLIC_IP}` does not
    # forward 7881/7882, and the server's own view of itself is an overlay
    # address meaningless outside the swarm — so every client was handed a
    # candidate it could not route to and failed with "could not establish pc
    # connection". It now advertises the swarm node, which callers on this
    # network can reach and which is verified answering on both ports.
    #
    # And host-mode publishing put 7881/7882 on one node's own interfaces,
    # where they were reachable from nothing we could observe — not the LAN,
    # not the public address, not the manager. Ingress publishing puts them on
    # the swarm routing mesh instead, so they answer on every node, including
    # the one the ingress domain already resolves to.
    environment:
      # One config body rather than flags plus environment: the media settings
      # below have no flag equivalents, and splitting the configuration across
      # both is how a setting ends up silently not applying.
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses:
          - 0.0.0.0
        rtc:
          tcp_port: 7881
          udp_port: 7882
          # The address clients are told to send media to. Discovery is wrong
          # here: the only interface the server can see is its overlay address,
          # and the public address does not forward 7881/7882 — both were
          # advertised and neither could be reached, which is what "could not
          # establish pc connection" was. The swarm node is reachable on the
          # network callers are on, and it is now answering on both ports.
          # Opening those ports through to the public address is what this line
          # is waiting on; until then a caller must be on the network.
          node_ip: 10.0.0.101
        redis:
          address: media-redis:6379
        keys:
          ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
        logging:
          level: info
    networks:
      - dokploy-network
    ports:
      - target: 7881
        published: 7881
        protocol: tcp
      - target: 7882
        published: 7882
        protocol: udp
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname==dokploy-mgr
      restart_policy:
        condition: any
        delay: 5s

  media-redis:
    image: redis:7-alpine
    networks:
      - dokploy-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname==dokploy-mgr
      restart_policy:
        condition: any
        delay: 5s

  # Recording. Every call the agent holds is meant to be kept as audio, and
  # none of them were: the application asked LiveKit for an egress on every
  # single call and there was no egress service in this deployment to answer.
  # LiveKit queues the request against a worker pool of zero, so it never
  # failed either — it timed out, per call, for as long as recording has
  # existed. Nothing needs configuring on the application side; the worker
  # simply had to exist.
  #
  # It joins the same Redis the media server and SIP use — that is how LiveKit
  # dispatches an egress to a worker — and writes straight to the company's
  # object storage from here, so the bytes never touch the application.
  livekit-egress:
    image: livekit/egress:latest
    environment:
      EGRESS_CONFIG_BODY: |
        redis:
          address: media-redis:6379
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://livekit:7880
        insecure: false
        logging:
          level: info
    # Room composite drives a headless Chrome, which needs to sandbox itself.
    cap_add:
      - SYS_ADMIN
    networks:
      - dokploy-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname==dokploy-mgr
      restart_policy:
        condition: any
        delay: 5s

  # SIP ingress — the public address a carrier trunk or PBX points at.
  livekit-sip:
    image: livekit/sip:latest
    environment:
      SIP_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://livekit:7880
        redis:
          address: media-redis:6379
        sip_port: 5060
        rtp_port: 10000-10019
        use_external_ip: true
        logging:
          level: info
    networks:
      - dokploy-network
    ports:
      - target: 5060
        published: 5060
        protocol: udp
        mode: host
      - target: 5060
        published: 5060
        protocol: tcp
        mode: host
      - target: 10000
        published: 10000
        protocol: udp
        mode: host
      - target: 10001
        published: 10001
        protocol: udp
        mode: host
      - target: 10002
        published: 10002
        protocol: udp
        mode: host
      - target: 10003
        published: 10003
        protocol: udp
        mode: host
      - target: 10004
        published: 10004
        protocol: udp
        mode: host
      - target: 10005
        published: 10005
        protocol: udp
        mode: host
      - target: 10006
        published: 10006
        protocol: udp
        mode: host
      - target: 10007
        published: 10007
        protocol: udp
        mode: host
      - target: 10008
        published: 10008
        protocol: udp
        mode: host
      - target: 10009
        published: 10009
        protocol: udp
        mode: host
      - target: 10010
        published: 10010
        protocol: udp
        mode: host
      - target: 10011
        published: 10011
        protocol: udp
        mode: host
      - target: 10012
        published: 10012
        protocol: udp
        mode: host
      - target: 10013
        published: 10013
        protocol: udp
        mode: host
      - target: 10014
        published: 10014
        protocol: udp
        mode: host
      - target: 10015
        published: 10015
        protocol: udp
        mode: host
      - target: 10016
        published: 10016
        protocol: udp
        mode: host
      - target: 10017
        published: 10017
        protocol: udp
        mode: host
      - target: 10018
        published: 10018
        protocol: udp
        mode: host
      - target: 10019
        published: 10019
        protocol: udp
        mode: host
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname==dokploy-mgr
      restart_policy:
        condition: any
        delay: 5s

  # Dev mail lab, matching local: Mailpit catches outbound, GreenMail offers
  # accept-anything IMAP/SMTP for wiring agents end to end. Internal only.
  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - dokploy-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname==dokploy-mgr
      restart_policy:
        condition: any
        delay: 5s

  greenmail:
    image: greenmail/standalone:latest
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled
    networks:
      - dokploy-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname==dokploy-mgr
      restart_policy:
        condition: any
        delay: 5s
