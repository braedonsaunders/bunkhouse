# bunkhouse stack for Dokploy (project "bunkhouse").
#
# Deployed as a SWARM STACK (composeType "stack") pinned to the manager node:
# placement puts every service beside dokploy-traefik, and ingress is wired by
# Dokploy managed domains (Traefik file provider) — one hostname to web:3000,
# one to livekit:7880 over wss. A Traefik TCP router on websecure sends
# TURN/TLS traffic for LIVEKIT_TURN_DOMAIN to LiveKit's embedded TURN server.
# The GitHub deploy workflow bumps BUNKHOUSE_TAG and triggers compose.deploy.
#
# Database, app Redis, and object storage are EXISTING shared services, never
# bundled containers — point BUNKHOUSE_DB_URL, BUNKHOUSE_REDIS_URL, and the
# APPKIT_STORAGE_* variables at whatever your infrastructure already runs. The
# media plane (LiveKit + SIP) runs here with its own private Redis, exactly as
# in local dev, but with real API keys and the public address announced to SIP
# peers. SIP/RTP ports publish in host mode on the manager — the public ingress
# a carrier or PBX points at.

networks:
  dokploy-network:
    external: true
  # The shared services network, where the database, Redis, and object storage
  # this stack talks to already live. Create it out of band; it is not managed
  # here, and its name is the only thing this file needs to know about it.
  infra-net:
    external: true

volumes:
  # Agent workspaces belong on shared network storage like every other durable
  # volume — nothing bunkhouse keeps should sit on a swarm node's local disk,
  # or it vanishes when the task reschedules. The key is deliberately NOT
  # 'agent-homes': that name already exists as a local volume, and Docker
  # reuses an existing volume verbatim, driver options and all.
  #
  # Both values come from the deployment's environment, which the deploy
  # workflow writes from repository variables before every deploy — so this
  # file names no particular company's storage, and nothing has to be set by
  # hand. Deploying outside that workflow means setting them yourself.
  agent-workspaces:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${BUNKHOUSE_NFS_ADDR},nfsvers=4,rw,hard,timeo=600"
      device: "${BUNKHOUSE_NFS_EXPORT}"

services:
  web:
    image: ghcr.io/braedonsaunders/bunkhouse:${BUNKHOUSE_TAG:-latest}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: '3000'
      BUNKHOUSE_DB_URL: ${BUNKHOUSE_DB_URL}
      BUNKHOUSE_SUPER_URL: ${BUNKHOUSE_SUPER_URL}
      BUNKHOUSE_REDIS_URL: ${BUNKHOUSE_REDIS_URL}
      APPKIT_SECRET: ${APPKIT_SECRET}
      # One public URL for browsers, server actions, and the voice agent alike
      # (containers reach the public host by hairpin, like the CI runner does).
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      # Authentication: session signing, public origin, and the first-boot
      # owner (consumed only while no credentialed account exists).
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      APP_URL: ${APP_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # Object storage (files ledger: deliverables, mail attachments).
      APPKIT_STORAGE_ENDPOINT: ${APPKIT_STORAGE_ENDPOINT}
      APPKIT_STORAGE_ACCESS_KEY_ID: ${APPKIT_STORAGE_ACCESS_KEY_ID}
      APPKIT_STORAGE_SECRET_ACCESS_KEY: ${APPKIT_STORAGE_SECRET_ACCESS_KEY}
      APPKIT_STORAGE_BUCKET: ${APPKIT_STORAGE_BUCKET:-bunkhouse}
      BUNKHOUSE_AGENT_HOMES: /data/agent-homes
      # Where a shell command actually runs. The swarm cannot give a container
      # what bubblewrap needs (see deploy/shell-runner.compose.yaml), so the
      # sandbox is its own Compose application and this is how to reach it.
      # Unset, agents run the shell in-process — right on a developer machine,
      # impossible here.
      BUNKHOUSE_SHELL_URL: ${BUNKHOUSE_SHELL_URL:-}
      BUNKHOUSE_SHELL_TOKEN: ${BUNKHOUSE_SHELL_TOKEN:-}
    volumes:
      - agent-workspaces:/data/agent-homes
    networks:
      - dokploy-network
      - infra-net
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname==dokploy-mgr
      resources:
        limits:
          memory: 2g
      restart_policy:
        condition: any
        delay: 5s

  # Background worker: mailbox sync, duty scheduler, run executor, approval
  # resume, memory consolidation. Same image, no ingress; web owns migrations.
  worker:
    image: ghcr.io/braedonsaunders/bunkhouse:${BUNKHOUSE_TAG:-latest}
    command: ["sh", "-c", "NODE_OPTIONS=--conditions=react-server exec apps/web/node_modules/.bin/tsx apps/web/scripts/worker.mts"]
    environment:
      NODE_ENV: production
      BUNKHOUSE_DB_URL: ${BUNKHOUSE_DB_URL}
      BUNKHOUSE_SUPER_URL: ${BUNKHOUSE_SUPER_URL}
      BUNKHOUSE_REDIS_URL: ${BUNKHOUSE_REDIS_URL}
      APPKIT_SECRET: ${APPKIT_SECRET}
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      APP_URL: ${APP_URL}
      APPKIT_STORAGE_ENDPOINT: ${APPKIT_STORAGE_ENDPOINT}
      APPKIT_STORAGE_ACCESS_KEY_ID: ${APPKIT_STORAGE_ACCESS_KEY_ID}
      APPKIT_STORAGE_SECRET_ACCESS_KEY: ${APPKIT_STORAGE_SECRET_ACCESS_KEY}
      APPKIT_STORAGE_BUCKET: ${APPKIT_STORAGE_BUCKET:-bunkhouse}
      BUNKHOUSE_AGENT_HOMES: /data/agent-homes
      # Where a shell command actually runs. The swarm cannot give a container
      # what bubblewrap needs (see deploy/shell-runner.compose.yaml), so the
      # sandbox is its own Compose application and this is how to reach it.
      # Unset, agents run the shell in-process — right on a developer machine,
      # impossible here.
      BUNKHOUSE_SHELL_URL: ${BUNKHOUSE_SHELL_URL:-}
      BUNKHOUSE_SHELL_TOKEN: ${BUNKHOUSE_SHELL_TOKEN:-}
    volumes:
      - agent-workspaces:/data/agent-homes
    networks:
      - dokploy-network
      - infra-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname==dokploy-mgr
      resources:
        limits:
          memory: 1g
      restart_policy:
        condition: any
        delay: 5s

  # The voice agent: registers against LiveKit and answers every call room.
  voice-agent:
    image: ghcr.io/braedonsaunders/bunkhouse:${BUNKHOUSE_TAG:-latest}
    command: ["sh", "-c", "NODE_OPTIONS=--conditions=react-server exec apps/web/node_modules/.bin/tsx apps/web/scripts/voice-agent.mts start"]
    environment:
      NODE_ENV: production
      BUNKHOUSE_DB_URL: ${BUNKHOUSE_DB_URL}
      BUNKHOUSE_SUPER_URL: ${BUNKHOUSE_SUPER_URL}
      BUNKHOUSE_REDIS_URL: ${BUNKHOUSE_REDIS_URL}
      APPKIT_SECRET: ${APPKIT_SECRET}
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      APP_URL: ${APP_URL}
      APPKIT_STORAGE_ENDPOINT: ${APPKIT_STORAGE_ENDPOINT}
      APPKIT_STORAGE_ACCESS_KEY_ID: ${APPKIT_STORAGE_ACCESS_KEY_ID}
      APPKIT_STORAGE_SECRET_ACCESS_KEY: ${APPKIT_STORAGE_SECRET_ACCESS_KEY}
      APPKIT_STORAGE_BUCKET: ${APPKIT_STORAGE_BUCKET:-bunkhouse}
      BUNKHOUSE_AGENT_HOMES: /data/agent-homes
      # Where a shell command actually runs. The swarm cannot give a container
      # what bubblewrap needs (see deploy/shell-runner.compose.yaml), so the
      # sandbox is its own Compose application and this is how to reach it.
      # Unset, agents run the shell in-process — right on a developer machine,
      # impossible here.
      BUNKHOUSE_SHELL_URL: ${BUNKHOUSE_SHELL_URL:-}
      BUNKHOUSE_SHELL_TOKEN: ${BUNKHOUSE_SHELL_TOKEN:-}
    volumes:
      - agent-workspaces:/data/agent-homes
    networks:
      - dokploy-network
      - infra-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname==dokploy-mgr
      resources:
        limits:
          # A call is the heaviest thing this image runs: the worker process
          # plus a job process per live call, each carrying the plugins and
          # the VAD's onnx runtime. Headroom here is cheaper than a worker the
          # swarm kills mid-ring — see numIdleProcesses in voice-agent.mts.
          memory: 3g
      restart_policy:
        condition: any
        delay: 5s

  livekit:
    image: livekit/livekit-server:latest
    # Signalling and the most compatible media fallback both enter through
    # Traefik on 443. Direct TCP/UDP media stays published in host mode for the
    # fast path, while embedded TURN/TLS gives callers outside the node's LAN
    # a route that works through restrictive firewalls and container networks.
    environment:
      # One config body rather than flags plus environment: the media settings
      # below have no flag equivalents, and splitting the configuration across
      # both is how a setting ends up silently not applying.
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses:
          - 0.0.0.0
        rtc:
          tcp_port: 7881
          udp_port: 7882
          node_ip: ${LIVEKIT_NODE_IP:-10.0.0.101}
        turn:
          enabled: true
          domain: ${LIVEKIT_TURN_DOMAIN:-bunkhouse-turn.cloud.rassaun.com}
          # Traefik terminates TURN/TLS on websecure and forwards plaintext to
          # this port. external_tls keeps the advertised URI as turns:443.
          tls_port: 443
          external_tls: true
          ttl_seconds: 300
          # LiveKit blocks TURN relays to private targets by default. Permit
          # only the configured SFU node, not the rest of the private network.
          allow_restricted_peer_cidrs:
            - "${LIVEKIT_NODE_IP:-10.0.0.101}/32"
        redis:
          address: media-redis:6379
        keys:
          ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
        logging:
          level: info
    networks:
      - dokploy-network
    # Dokploy injects its managed signalling-domain labels at this level. Keep
    # the TURN router in the same label source: Traefik's Swarm provider skips
    # a service entirely when both container and deploy labels are present.
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.tcp.routers.bunkhouse-turn.rule=HostSNI(`${LIVEKIT_TURN_DOMAIN:-bunkhouse-turn.cloud.rassaun.com}`)"
      - "traefik.tcp.routers.bunkhouse-turn.entrypoints=websecure"
      - "traefik.tcp.routers.bunkhouse-turn.service=bunkhouse-turn"
      - "traefik.tcp.routers.bunkhouse-turn.tls=true"
      - "traefik.tcp.routers.bunkhouse-turn.tls.certresolver=letsencrypt"
      - "traefik.tcp.services.bunkhouse-turn.loadbalancer.server.port=443"
    ports:
      - target: 7881
        published: 7881
        protocol: tcp
        mode: host
      - target: 7882
        published: 7882
        protocol: udp
        mode: host
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname==dokploy-mgr
      restart_policy:
        condition: any
        delay: 5s

  media-redis:
    image: redis:7-alpine
    networks:
      - dokploy-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname==dokploy-mgr
      restart_policy:
        condition: any
        delay: 5s

  # Recording. Every call the agent holds is meant to be kept as audio, and
  # none of them were: the application asked LiveKit for an egress on every
  # single call and there was no egress service in this deployment to answer.
  # LiveKit queues the request against a worker pool of zero, so it never
  # failed either — it timed out, per call, for as long as recording has
  # existed. Nothing needs configuring on the application side; the worker
  # simply had to exist.
  #
  # It joins the same Redis the media server and SIP use — that is how LiveKit
  # dispatches an egress to a worker — and writes straight to the company's
  # object storage from here, so the bytes never touch the application.
  livekit-egress:
    image: livekit/egress:latest
    environment:
      EGRESS_CONFIG_BODY: |
        redis:
          address: media-redis:6379
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://livekit:7880
        insecure: false
        logging:
          level: info
    # Room composite drives a headless Chrome, which needs to sandbox itself.
    cap_add:
      - SYS_ADMIN
    networks:
      - dokploy-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname==dokploy-mgr
      restart_policy:
        condition: any
        delay: 5s

  # SIP ingress — the public address a carrier trunk or PBX points at.
  livekit-sip:
    image: livekit/sip:latest
    environment:
      SIP_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://livekit:7880
        redis:
          address: media-redis:6379
        sip_port: 5060
        rtp_port: 10000-10019
        use_external_ip: true
        logging:
          level: info
    networks:
      - dokploy-network
    ports:
      - target: 5060
        published: 5060
        protocol: udp
        mode: host
      - target: 5060
        published: 5060
        protocol: tcp
        mode: host
      - target: 10000
        published: 10000
        protocol: udp
        mode: host
      - target: 10001
        published: 10001
        protocol: udp
        mode: host
      - target: 10002
        published: 10002
        protocol: udp
        mode: host
      - target: 10003
        published: 10003
        protocol: udp
        mode: host
      - target: 10004
        published: 10004
        protocol: udp
        mode: host
      - target: 10005
        published: 10005
        protocol: udp
        mode: host
      - target: 10006
        published: 10006
        protocol: udp
        mode: host
      - target: 10007
        published: 10007
        protocol: udp
        mode: host
      - target: 10008
        published: 10008
        protocol: udp
        mode: host
      - target: 10009
        published: 10009
        protocol: udp
        mode: host
      - target: 10010
        published: 10010
        protocol: udp
        mode: host
      - target: 10011
        published: 10011
        protocol: udp
        mode: host
      - target: 10012
        published: 10012
        protocol: udp
        mode: host
      - target: 10013
        published: 10013
        protocol: udp
        mode: host
      - target: 10014
        published: 10014
        protocol: udp
        mode: host
      - target: 10015
        published: 10015
        protocol: udp
        mode: host
      - target: 10016
        published: 10016
        protocol: udp
        mode: host
      - target: 10017
        published: 10017
        protocol: udp
        mode: host
      - target: 10018
        published: 10018
        protocol: udp
        mode: host
      - target: 10019
        published: 10019
        protocol: udp
        mode: host
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname==dokploy-mgr
      restart_policy:
        condition: any
        delay: 5s

  # Dev mail lab, matching local: Mailpit catches outbound, GreenMail offers
  # accept-anything IMAP/SMTP for wiring agents end to end. Internal only.
  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - dokploy-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname==dokploy-mgr
      restart_policy:
        condition: any
        delay: 5s

  greenmail:
    image: greenmail/standalone:latest
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled
    networks:
      - dokploy-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname==dokploy-mgr
      restart_policy:
        condition: any
        delay: 5s
