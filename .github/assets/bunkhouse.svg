<!--
  README lockup. Same geometry as the in-app mark (apps/web/src/components/
  brand-logo.tsx): the roof spans only "house" — eaves from the h stem's centre
  to the e's ink edge, stroke matched to the h's stem weight, ridge 0.56em, eave
  returns 0.13em, held 0.06em off the ascenders. The app measures those glyph
  metrics at runtime; a README image can't, so each segment of the word is
  pinned to the measured advance with textLength and the roof is placed off
  those. Motion mirrors globals.css "Brand logo animation".
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640.14 346.85" width="640.14" height="346.85" role="img" aria-labelledby="bh-title bh-desc">
  <title id="bh-title">Bunkhouse</title>
  <desc id="bh-desc">The Bunkhouse wordmark, a roofline drawn over "house" with a chimney, drifting smoke, and an amber attic light.</desc>
  <style>
    .ink { fill: #18233b; }
    .roof { fill: none; stroke: #18233b; stroke-linejoin: round; }
    .word { font: 500 128px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; letter-spacing: -1.92px; }
    .tag { font: 500 23.68px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; letter-spacing: 3.32px; opacity: .58; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #edf2f7; }
      .roof { stroke: #edf2f7; }
    }

    /* Build-in, then the smoke keeps drifting — the splash sequence from
       globals.css ("Brand logo animation"). */
    .draw { stroke-dasharray: 1; animation: bh-draw .8s cubic-bezier(.65,0,.35,1) var(--bd) backwards; }
    .word, .tag { animation: bh-fade .5s ease-out backwards; }
    .tag { animation-delay: 1.1s; }
    .dot { animation: bh-pop .5s cubic-bezier(.34,1.56,.64,1) .95s backwards; transform-box: fill-box; transform-origin: center; }
    .halo { animation: bh-fade .5s ease-out .95s backwards, bh-breathe 3s ease-in-out 2.15s infinite; }
    .smoke { opacity: 0; animation: bh-smoke 3.2s ease-out var(--sd) infinite; }
    @keyframes bh-draw { from { stroke-dashoffset: 1; } }
    @keyframes bh-fade { from { opacity: 0; } }
    @keyframes bh-pop { from { opacity: 0; transform: scale(.2); } }
    @keyframes bh-breathe { 0%, 100% { opacity: .22; } 50% { opacity: .42; } }
    @keyframes bh-smoke {
      0% { opacity: 0; transform: translateY(6.4px); }
      25% { opacity: .5; }
      100% { opacity: 0; transform: translateY(-25.6px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .draw, .word, .tag, .dot, .halo { animation: none; }
      .smoke { animation: none; opacity: .4; }
    }
  </style>
  <g class="ink word">
    <text x="7.68" y="272.23" textLength="268.46" lengthAdjust="spacingAndGlyphs">bunk</text>
    <text x="276.14" y="272.23" textLength="69.01" lengthAdjust="spacingAndGlyphs">h</text>
    <text x="345.14" y="272.23" textLength="195.17" lengthAdjust="spacingAndGlyphs">ous</text>
    <text x="540.31" y="272.23" textLength="65.47" lengthAdjust="spacingAndGlyphs">e</text>
    <text x="605.78" y="272.23" textLength="26.68" lengthAdjust="spacingAndGlyphs" fill="#F5A623">.</text>
  </g>
  <text class="ink tag" x="320.07" y="331.11" text-anchor="middle">AI EMPLOYEES · IN YOUR INBOX</text>
  <g transform="translate(290.01 0)">
    <path class="roof draw" style="--bd:.15s" pathLength="1" stroke-width="13.37" stroke-linecap="butt"
      d="M0 174.37L0 157.73L153.65 86.05L307.3 157.73L307.3 174.37"/>
    <path class="roof draw" style="--bd:.65s" pathLength="1" stroke-width="13.37" stroke-linecap="round" d="M215.11 114.72L215.11 92.45"/>
    <path class="roof draw" style="--bd:.72s" pathLength="1" stroke-width="13.37" stroke-linecap="round" d="M248.39 130.24L248.39 92.45"/>
    <path class="roof draw" style="--bd:.8s" pathLength="1" stroke-width="13.37" stroke-linecap="round" d="M208.07 92.45L255.43 92.45"/>
    <circle class="halo" cx="153.65" cy="127.62" r="26.24" fill="#F5A623" opacity=".22"/>
    <circle class="dot" cx="153.65" cy="127.62" r="10.5" fill="#F5A623"/>
    <path class="roof smoke" style="--sd:1.4s" stroke-width="8.02" stroke-linecap="round"
      d="M231.75 74.53c11.52 -10.24 -11.52 -20.48 0 -30.72"/>
    <path class="roof smoke" style="--sd:2.6s" stroke-width="6.82" stroke-linecap="round"
      d="M243.27 66.85c10.24 -8.96 -10.24 -17.92 0 -26.88"/>
  </g>
</svg>
