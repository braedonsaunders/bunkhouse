name: CI + Deploy (dev)

# Every push to main: typecheck gate → publish the image to ghcr → point the
# Dokploy "bunkhouse" compose at the new tag and redeploy → wait for the
# public host to serve again.
#
# Secrets: DOKPLOY_URL (http://dokploy:3000 — the panel is LAN-only, reached
#          from the shared self-hosted runner over dokploy-network),
#          DOKPLOY_TOKEN (x-api-key), DOKPLOY_COMPOSE_ID (bunkhouse compose).
#
# The deploy job runs on the shared Dokploy runner (bunkhouse-runner in the
# github-runners project); check/build stay on GitHub-hosted runners.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/braedonsaunders/bunkhouse

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bunkhouse_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bunkhouse_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency security gate
        run: pnpm audit --prod --audit-level high
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Migration and RLS canary
        env:
          BUNKHOUSE_DB_URL: postgresql://postgres:postgres@localhost:5432/bunkhouse_ci
          BUNKHOUSE_SUPER_URL: postgresql://postgres:postgres@localhost:5432/bunkhouse_ci
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql "$BUNKHOUSE_DB_URL" -v ON_ERROR_STOP=1 -c "create role bunkhouse_super login bypassrls"
          pnpm --filter web db:migrate
          pnpm --filter web db:migrate
          psql "$BUNKHOUSE_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          create role bunkhouse_rls_test login;
          grant usage on schema public to bunkhouse_rls_test;
          grant select, insert, update, delete on all tables in schema public to bunkhouse_rls_test;
          grant usage, select on all sequences in schema public to bunkhouse_rls_test;
          insert into tenants (id, name, slug) values
            ('00000000-0000-0000-0000-000000000001', 'One', 'one'),
            ('00000000-0000-0000-0000-000000000002', 'Two', 'two');
          insert into people (tenant_id, kind, status, name, title, email) values
            ('00000000-0000-0000-0000-000000000001', 'human', 'active', 'One', 'Owner', 'one@example.test'),
            ('00000000-0000-0000-0000-000000000002', 'human', 'active', 'Two', 'Owner', 'two@example.test');
          set role bunkhouse_rls_test;
          set app.tenant_id = '00000000-0000-0000-0000-000000000001';
          insert into audit_log (tenant_id, action, entity_type, summary) values
            ('00000000-0000-0000-0000-000000000001', 'ci.immutability_check', 'ci', 'CI ledger guard canary');
          do $$ begin
            if (select count(*) from people) <> 1 then
              raise exception 'RLS tenant isolation failed';
            end if;
            begin
              update audit_log set summary = 'tampered';
              raise exception 'Immutable ledger enforcement failed';
            exception when sqlstate '55000' then
              null;
            end;
          end $$;
          reset role;
          SQL

  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

  deploy:
    needs: build
    runs-on: [self-hosted, linux, x64, dokploy]
    timeout-minutes: 20
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Point Dokploy at the new image tag
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
          NEW_TAG: ${{ needs.build.outputs.tag }}
          # Where this deployment's durable storage lives. Repository variables
          # rather than literals in the compose: the file is written to be
          # public, and one company's NFS export is not part of the product.
          NFS_ADDR: ${{ vars.BUNKHOUSE_NFS_ADDR }}
          NFS_EXPORT: ${{ vars.BUNKHOUSE_NFS_EXPORT }}
        run: |
          set -euo pipefail
          # Fail here, naming the variable, rather than letting an empty value
          # reach the compose and mount agent workspaces onto nothing.
          : "${NFS_ADDR:?repository variable BUNKHOUSE_NFS_ADDR is not set}"
          : "${NFS_EXPORT:?repository variable BUNKHOUSE_NFS_EXPORT is not set}"
          base="${DOKPLOY_URL%/}"
          current="$(curl -sS --fail -H "x-api-key: $DOKPLOY_TOKEN" \
            -G "$base/api/compose.one" --data-urlencode "composeId=$COMPOSE_ID")"
          new_env="$(echo "$current" | jq -r '.env // ""')"

          # Replace the line if Dokploy already carries the key, append it if
          # not. Values hold ':' and '/' but never '|', so '|' delimits safely.
          upsert() {
            if printf '%s\n' "$new_env" | grep -q "^$1="; then
              new_env="$(printf '%s\n' "$new_env" | sed "s|^$1=.*|$1=$2|")"
            else
              new_env="$(printf '%s\n%s=%s\n' "$new_env" "$1" "$2")"
            fi
          }
          upsert BUNKHOUSE_TAG "$NEW_TAG"
          upsert BUNKHOUSE_NFS_ADDR "$NFS_ADDR"
          upsert BUNKHOUSE_NFS_EXPORT "$NFS_EXPORT"

          compose_file="$(cat deploy/dokploy.compose.yaml)"
          jq -n --arg id "$COMPOSE_ID" --arg env "$new_env" --arg composeFile "$compose_file" \
            '{composeId:$id, env:$env, composeFile:$composeFile}' \
            | curl -sS --fail -H "x-api-key: $DOKPLOY_TOKEN" \
                -H 'content-type: application/json' \
                -X POST "$base/api/compose.update" --data @- > /dev/null
          echo "Dokploy compose source is current and BUNKHOUSE_TAG=${NEW_TAG}"

      # The agent shell sandbox is a second application, deployed as plain
      # Compose because swarm silently drops the security options bubblewrap
      # needs. It runs the same image, so it has to move with it — pinned to
      # whatever tag it was created with, it would quietly drift a version
      # behind the app it serves and stay there.
      - name: Point the shell sandbox at the same image
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          SHELL_COMPOSE_ID: ${{ secrets.DOKPLOY_SHELL_COMPOSE_ID }}
          NEW_TAG: ${{ needs.build.outputs.tag }}
          NFS_ADDR: ${{ vars.BUNKHOUSE_NFS_ADDR }}
          NFS_EXPORT: ${{ vars.BUNKHOUSE_NFS_EXPORT }}
        run: |
          set -euo pipefail
          # Checked here rather than in an `if:` — the secrets context is not
          # available to step conditions, and using it there does not warn, it
          # makes the whole workflow invalid so no job runs at all.
          if [ -z "${SHELL_COMPOSE_ID:-}" ]; then
            echo "No shell sandbox configured (DOKPLOY_SHELL_COMPOSE_ID unset) — nothing to update."
            exit 0
          fi
          : "${NFS_ADDR:?repository variable BUNKHOUSE_NFS_ADDR is not set}"
          : "${NFS_EXPORT:?repository variable BUNKHOUSE_NFS_EXPORT is not set}"
          base="${DOKPLOY_URL%/}"
          current="$(curl -sS --fail -H "x-api-key: $DOKPLOY_TOKEN" \
            -G "$base/api/compose.one" --data-urlencode "composeId=$SHELL_COMPOSE_ID")"
          new_env="$(echo "$current" | jq -r '.env // ""')"
          # BUNKHOUSE_SHELL_TOKEN is deliberately not touched: it is a shared
          # secret set once on both ends, and rewriting it here would break the
          # agreement every deploy.
          upsert() {
            if printf '%s\n' "$new_env" | grep -q "^$1="; then
              new_env="$(printf '%s\n' "$new_env" | sed "s|^$1=.*|$1=$2|")"
            else
              new_env="$(printf '%s\n%s=%s\n' "$new_env" "$1" "$2")"
            fi
          }
          upsert BUNKHOUSE_TAG "$NEW_TAG"
          upsert BUNKHOUSE_NFS_ADDR "$NFS_ADDR"
          upsert BUNKHOUSE_NFS_EXPORT "$NFS_EXPORT"
          compose_file="$(cat deploy/shell-runner.compose.yaml)"
          jq -n --arg id "$SHELL_COMPOSE_ID" --arg env "$new_env" --arg composeFile "$compose_file" \
            '{composeId:$id, env:$env, composeFile:$composeFile}' \
            | curl -sS --fail -H "x-api-key: $DOKPLOY_TOKEN" \
                -H 'content-type: application/json' \
                -X POST "$base/api/compose.update" --data @- > /dev/null
          curl -sS --fail -H "x-api-key: $DOKPLOY_TOKEN" -H 'content-type: application/json' \
            -X POST "$base/api/compose.deploy" --data "{\"composeId\":\"$SHELL_COMPOSE_ID\"}"
          echo "Shell sandbox pointed at ${NEW_TAG}"

      - name: Trigger deployment
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
        run: |
          set -euo pipefail
          curl -sS --fail -H "x-api-key: $DOKPLOY_TOKEN" \
            -H 'content-type: application/json' \
            -X POST "${DOKPLOY_URL%/}/api/compose.deploy" \
            --data "{\"composeId\":\"$COMPOSE_ID\"}"
          echo "Deployment queued"

      - name: Wait for Dokploy deployment to finish
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
        run: |
          set -euo pipefail
          base="${DOKPLOY_URL%/}"
          for i in $(seq 1 60); do
            sleep 10
            latest="$(curl -sS --fail -H "x-api-key: $DOKPLOY_TOKEN" \
              -G "$base/api/deployment.allByCompose" --data-urlencode "composeId=$COMPOSE_ID" \
              | jq -r 'sort_by(.createdAt) | last | .status')"
            echo "deployment status: $latest"
            if [ "$latest" = "done" ]; then exit 0; fi
            if [ "$latest" = "error" ]; then
              echo "::error::Dokploy deployment failed"
              exit 1
            fi
          done
          # Still running is not failure — a large image pull simply takes as
          # long as it takes; Dokploy finishes on its own after we stop looking.
          echo "::warning::Deployment still running after 10 minutes — letting it converge."
          exit 0

      - name: Production health gate
        env:
          PUBLIC_URL: ${{ vars.BUNKHOUSE_PUBLIC_URL }}
        run: |
          set -euo pipefail
          if [ -z "${PUBLIC_URL:-}" ]; then
            echo "::warning::repository variable BUNKHOUSE_PUBLIC_URL is not set — skipping the health check."
            exit 0
          fi
          host="${PUBLIC_URL#*://}"
          for i in $(seq 1 120); do
            sleep 5
            code="$(curl -s -o /dev/null -w '%{http_code}' "${PUBLIC_URL%/}/login" || true)"
            echo "https status: $code"
            if [ "$code" = "200" ]; then
              echo "$host is serving"
              exit 0
            fi
          done
          echo "::error::The deployed application did not become healthy within 10 minutes."
          exit 1
