name: CI + Deploy (dev)

# Every push to main: typecheck gate → publish the image to ghcr → point the
# Dokploy "bunkhouse" compose at the new tag and redeploy → wait for the
# public host to serve again.
#
# Secrets: DOKPLOY_URL (http://dokploy:3000 — the panel is LAN-only, reached
#          from the shared self-hosted runner over dokploy-network),
#          DOKPLOY_TOKEN (x-api-key), DOKPLOY_COMPOSE_ID (bunkhouse compose).
#
# The deploy job runs on the shared Dokploy runner (bunkhouse-runner in the
# github-runners project); check/build stay on GitHub-hosted runners.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/braedonsaunders/bunkhouse

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bunkhouse_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bunkhouse_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency security gate
        run: pnpm audit --prod --audit-level high
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Migration and RLS canary
        env:
          BUNKHOUSE_DB_URL: postgresql://postgres:postgres@localhost:5432/bunkhouse_ci
          BUNKHOUSE_SUPER_URL: postgresql://postgres:postgres@localhost:5432/bunkhouse_ci
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql "$BUNKHOUSE_DB_URL" -v ON_ERROR_STOP=1 -c "create role bunkhouse_super login bypassrls"
          pnpm --filter web db:migrate
          pnpm --filter web db:migrate
          # ENABLE without FORCE exempts the table owner, and the application
          # connects as the owner — so a tenant table that is enabled but not
          # forced has a policy that is never consulted in production. The
          # isolation check below cannot see this: it runs as a role that owns
          # nothing, which every policy applies to whether forced or not. That
          # is how colleague_messages sat unforced from 0039 until 0048. This
          # asks the catalog instead, and covers every table rather than one.
          psql "$BUNKHOUSE_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare unforced text;
          begin
            select string_agg(c.relname, ', ' order by c.relname) into unforced
              from pg_class c join pg_namespace n on n.oid = c.relnamespace
             where c.relkind = 'r' and n.nspname = 'public'
               and c.relrowsecurity and not c.relforcerowsecurity;
            if unforced is not null then
              raise exception 'RLS enabled but not FORCEd: %', unforced;
            end if;
          end $$;
          SQL
          psql "$BUNKHOUSE_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          create role bunkhouse_rls_test login;
          grant usage on schema public to bunkhouse_rls_test;
          grant select, insert, update, delete on all tables in schema public to bunkhouse_rls_test;
          grant usage, select on all sequences in schema public to bunkhouse_rls_test;
          insert into tenants (id, name, slug) values
            ('00000000-0000-0000-0000-000000000001', 'One', 'one'),
            ('00000000-0000-0000-0000-000000000002', 'Two', 'two');
          insert into people (tenant_id, kind, status, name, title, email) values
            ('00000000-0000-0000-0000-000000000001', 'human', 'active', 'One', 'Owner', 'one@example.test'),
            ('00000000-0000-0000-0000-000000000002', 'human', 'active', 'Two', 'Owner', 'two@example.test');
          set role bunkhouse_rls_test;
          set app.tenant_id = '00000000-0000-0000-0000-000000000001';
          insert into audit_log (tenant_id, action, entity_type, summary) values
            ('00000000-0000-0000-0000-000000000001', 'ci.immutability_check', 'ci', 'CI ledger guard canary');
          do $$ begin
            if (select count(*) from people) <> 1 then
              raise exception 'RLS tenant isolation failed';
            end if;
            begin
              update audit_log set summary = 'tampered';
              raise exception 'Immutable ledger enforcement failed';
            exception when sqlstate '55000' then
              null;
            end;
          end $$;
          reset role;
          SQL
      - name: Database claims suite
        # The full claim tests: forced RLS on every tenant table, tenant
        # isolation both directions, all eleven append-only ledgers, and
        # procedure pinning — against the database the canary just migrated.
        env:
          BUNKHOUSE_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/bunkhouse_ci
        run: pnpm --filter web test:db

  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

  deploy:
    needs: build
    runs-on: [self-hosted, linux, x64, dokploy]
    timeout-minutes: 20
    environment: dev
    steps:
      - uses: actions/checkout@v7

      - name: Point Dokploy at the new image tag
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
          NEW_TAG: ${{ needs.build.outputs.tag }}
          # Where this deployment's durable storage lives. Repository variables
          # rather than literals in the compose: the file is written to be
          # public, and one company's NFS export is not part of the product.
          NFS_ADDR: ${{ vars.BUNKHOUSE_NFS_ADDR }}
          NFS_EXPORT: ${{ vars.BUNKHOUSE_NFS_EXPORT }}
        run: |
          set -euo pipefail
          # Fail here, naming the variable, rather than letting an empty value
          # reach the compose and mount agent workspaces onto nothing.
          : "${NFS_ADDR:?repository variable BUNKHOUSE_NFS_ADDR is not set}"
          : "${NFS_EXPORT:?repository variable BUNKHOUSE_NFS_EXPORT is not set}"
          base="${DOKPLOY_URL%/}"
          current="$(curl -sS --fail -H "x-api-key: $DOKPLOY_TOKEN" \
            -G "$base/api/compose.one" --data-urlencode "composeId=$COMPOSE_ID")"
          new_env="$(echo "$current" | jq -r '.env // ""')"

          # Replace the line if Dokploy already carries the key, append it if
          # not. Values hold ':' and '/' but never '|', so '|' delimits safely.
          upsert() {
            if printf '%s\n' "$new_env" | grep -q "^$1="; then
              new_env="$(printf '%s\n' "$new_env" | sed "s|^$1=.*|$1=$2|")"
            else
              new_env="$(printf '%s\n%s=%s\n' "$new_env" "$1" "$2")"
            fi
          }
          upsert BUNKHOUSE_TAG "$NEW_TAG"
          upsert BUNKHOUSE_NFS_ADDR "$NFS_ADDR"
          upsert BUNKHOUSE_NFS_EXPORT "$NFS_EXPORT"

          # LiveKit, SIP, and egress use the same HA Redis deployment already
          # configured for Bunkhouse. Their config schema needs separate
          # address/password/database fields, so derive those fields from the
          # authoritative URL without emitting the credential to the log.
          redis_url="$(printf '%s\n' "$new_env" \
            | awk -F= '$1 == "BUNKHOUSE_REDIS_URL" { print substr($0, index($0, "=") + 1) }' \
            | tail -1)"
          : "${redis_url:?BUNKHOUSE_REDIS_URL is not set in Dokploy}"
          redis_parts="$(REDIS_URL="$redis_url" node -e '
            const url = new URL(process.env.REDIS_URL);
            const db = url.pathname.replace(/^\//, "") || "0";
            process.stdout.write([
              `${url.hostname}:${url.port || "6379"}`,
              decodeURIComponent(url.password),
              db,
            ].join("\t"));
          ')"
          IFS=$'\t' read -r redis_address redis_password redis_db <<< "$redis_parts"
          : "${redis_address:?could not derive the HA Redis address}"
          : "${redis_password:?could not derive the HA Redis password}"
          : "${redis_db:?could not derive the HA Redis database}"
          upsert BUNKHOUSE_MEDIA_REDIS_ADDRESS "$redis_address"
          upsert BUNKHOUSE_MEDIA_REDIS_PASSWORD "$redis_password"
          upsert BUNKHOUSE_MEDIA_REDIS_DB "$redis_db"

          compose_file="$(cat deploy/dokploy.compose.yaml)"
          jq -n --arg id "$COMPOSE_ID" --arg env "$new_env" --arg composeFile "$compose_file" \
            '{composeId:$id, env:$env, composeFile:$composeFile}' \
            | curl -sS --fail -H "x-api-key: $DOKPLOY_TOKEN" \
                -H 'content-type: application/json' \
                -X POST "$base/api/compose.update" --data @- > /dev/null
          echo "Dokploy compose source is current and BUNKHOUSE_TAG=${NEW_TAG}"

      # TURN is a raw TCP protocol after TLS termination, not HTTP. The HA edge
      # owns its SNI route and forwards to LiveKit's dedicated host port. An
      # inner Dokploy HTTP domain for the same host only starts a failing ACME
      # order and can never carry TURN, so remove the obsolete entry safely.
      - name: Remove the obsolete inner TURN HTTP domain
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
        run: |
          set -euo pipefail
          base="${DOKPLOY_URL%/}"
          current="$(curl -sS --fail -H "x-api-key: $DOKPLOY_TOKEN" \
            -G "$base/api/compose.one" --data-urlencode "composeId=$COMPOSE_ID")"
          turn_host="$(echo "$current" | jq -r '.env // ""' \
            | awk -F= '$1 == "LIVEKIT_TURN_DOMAIN" { print substr($0, index($0, "=") + 1) }' \
            | tail -1)"
          turn_host="${turn_host:-bunkhouse-turn.cloud.rassaun.com}"
          domains="$(curl -sS --fail -H "x-api-key: $DOKPLOY_TOKEN" \
            -G "$base/api/domain.byComposeId" --data-urlencode "composeId=$COMPOSE_ID")"

          domain_ids="$(echo "$domains" | jq -r --arg host "$turn_host" '.[] | select(.host == $host) | .domainId')"
          if [ -z "$domain_ids" ]; then
            echo "No obsolete Dokploy TURN domain remains: $turn_host"
            exit 0
          fi

          while IFS= read -r domain_id; do
            jq -n --arg domainId "$domain_id" '{domainId:$domainId}' \
              | curl -sS --fail -H "x-api-key: $DOKPLOY_TOKEN" \
                  -H 'content-type: application/json' \
                  -X POST "$base/api/domain.delete" --data @- > /dev/null
          done <<< "$domain_ids"
          echo "Removed obsolete Dokploy HTTP route: $turn_host"

      # The agent shell sandbox is a second application, deployed as plain
      # Compose because swarm silently drops the security options bubblewrap
      # needs. It runs the same image, so it has to move with it — pinned to
      # whatever tag it was created with, it would quietly drift a version
      # behind the app it serves and stay there.
      - name: Point the shell sandbox at the same image
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          SHELL_COMPOSE_ID: ${{ secrets.DOKPLOY_SHELL_COMPOSE_ID }}
          NEW_TAG: ${{ needs.build.outputs.tag }}
          NFS_ADDR: ${{ vars.BUNKHOUSE_NFS_ADDR }}
          NFS_EXPORT: ${{ vars.BUNKHOUSE_NFS_EXPORT }}
        run: |
          set -euo pipefail
          # Checked here rather than in an `if:` — the secrets context is not
          # available to step conditions, and using it there does not warn, it
          # makes the whole workflow invalid so no job runs at all.
          if [ -z "${SHELL_COMPOSE_ID:-}" ]; then
            echo "No shell sandbox configured (DOKPLOY_SHELL_COMPOSE_ID unset) — nothing to update."
            exit 0
          fi
          : "${NFS_ADDR:?repository variable BUNKHOUSE_NFS_ADDR is not set}"
          : "${NFS_EXPORT:?repository variable BUNKHOUSE_NFS_EXPORT is not set}"
          base="${DOKPLOY_URL%/}"
          current="$(curl -sS --fail -H "x-api-key: $DOKPLOY_TOKEN" \
            -G "$base/api/compose.one" --data-urlencode "composeId=$SHELL_COMPOSE_ID")"
          new_env="$(echo "$current" | jq -r '.env // ""')"
          # BUNKHOUSE_SHELL_TOKEN is deliberately not touched: it is a shared
          # secret set once on both ends, and rewriting it here would break the
          # agreement every deploy.
          upsert() {
            if printf '%s\n' "$new_env" | grep -q "^$1="; then
              new_env="$(printf '%s\n' "$new_env" | sed "s|^$1=.*|$1=$2|")"
            else
              new_env="$(printf '%s\n%s=%s\n' "$new_env" "$1" "$2")"
            fi
          }
          upsert BUNKHOUSE_TAG "$NEW_TAG"
          upsert BUNKHOUSE_NFS_ADDR "$NFS_ADDR"
          upsert BUNKHOUSE_NFS_EXPORT "$NFS_EXPORT"
          compose_file="$(cat deploy/shell-runner.compose.yaml)"
          jq -n --arg id "$SHELL_COMPOSE_ID" --arg env "$new_env" --arg composeFile "$compose_file" \
            '{composeId:$id, env:$env, composeFile:$composeFile}' \
            | curl -sS --fail -H "x-api-key: $DOKPLOY_TOKEN" \
                -H 'content-type: application/json' \
                -X POST "$base/api/compose.update" --data @- > /dev/null
          curl -sS --fail -H "x-api-key: $DOKPLOY_TOKEN" -H 'content-type: application/json' \
            -X POST "$base/api/compose.deploy" --data "{\"composeId\":\"$SHELL_COMPOSE_ID\"}"
          echo "Shell sandbox pointed at ${NEW_TAG}"

      - name: Trigger deployment
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
        run: |
          set -euo pipefail
          base="${DOKPLOY_URL%/}"
          # Remember the latest deployment before queuing this one. Polling
          # the unfiltered list can otherwise see an earlier successful row
          # and declare success before Dokploy inserts the new deployment.
          baseline="$(curl -sS --fail -H "x-api-key: $DOKPLOY_TOKEN" \
            -G "$base/api/deployment.allByCompose" --data-urlencode "composeId=$COMPOSE_ID" \
            | jq -r 'sort_by(.createdAt) | last | .createdAt // ""')"
          echo "DOKPLOY_DEPLOY_BASELINE=$baseline" >> "$GITHUB_ENV"
          curl -sS --fail -H "x-api-key: $DOKPLOY_TOKEN" \
            -H 'content-type: application/json' \
            -X POST "$base/api/compose.deploy" \
            --data "{\"composeId\":\"$COMPOSE_ID\"}"
          echo "Deployment queued"

      - name: Wait for Dokploy deployment to finish
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
          NEW_TAG: ${{ needs.build.outputs.tag }}
          PUBLIC_URL: ${{ vars.BUNKHOUSE_PUBLIC_URL }}
        run: |
          set -euo pipefail
          base="${DOKPLOY_URL%/}"

          # Dokploy's queue worker has occasionally recorded an error (or left
          # a job queued forever) after Swarm has already accepted the stack.
          # A status row is not the deployment: the authoritative proof is the
          # exact image on every Bunkhouse process, all desired replicas
          # running, and the public app serving. Never accept an old healthy
          # version as success for a new deployment.
          deployment_is_live() {
            local compose app_name expected service image desired running code
            compose="$(curl -sS --fail -H "x-api-key: $DOKPLOY_TOKEN" \
              -G "$base/api/compose.one" --data-urlencode "composeId=$COMPOSE_ID")" || return 1
            app_name="$(printf '%s' "$compose" | jq -r '.appName // empty')"
            [ -n "$app_name" ] || return 1
            expected="${IMAGE_NAME}:${NEW_TAG}"
            for unit in web worker voice-agent; do
              service="${app_name}_${unit}"
              image="$(docker service inspect --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}' "$service" 2>/dev/null)" || return 1
              image="${image%%@*}"
              [ "$image" = "$expected" ] || return 1
              desired="$(docker service inspect --format '{{.Spec.Mode.Replicated.Replicas}}' "$service" 2>/dev/null)" || return 1
              running="$(docker service ps --filter desired-state=running --format '{{.CurrentState}}' "$service" 2>/dev/null \
                | grep -c '^Running' || true)"
              [ "$running" -ge "$desired" ] || return 1
            done
            if [ -n "${PUBLIC_URL:-}" ]; then
              code="$(curl -s -o /dev/null -w '%{http_code}' "${PUBLIC_URL%/}/login" || true)"
              [ "$code" = "200" ] || return 1
            fi
          }

          # Narrow fallback for this compose only. Output is suppressed because
          # Dokploy's thrown command text contains the base64-encoded env file;
          # even encoded credentials never belong in CI logs. A non-zero return
          # is tolerated here only long enough to run the authoritative checks
          # above — Swarm can recover a transient task after deployCompose exits.
          deploy_compose_directly() {
            local dokploy_container
            dokploy_container="$(docker ps --filter 'ancestor=dokploy/dokploy' --format '{{.ID}}' | head -n 1)"
            [ -n "$dokploy_container" ] || return 1
            docker exec -e DOKPLOY_TARGET_COMPOSE_ID="$COMPOSE_ID" "$dokploy_container" \
              node --input-type=module -e '
                const { deployCompose } = await import("/app/node_modules/@dokploy/server/dist/services/compose.js");
                try {
                  await deployCompose({
                    composeId: process.env.DOKPLOY_TARGET_COMPOSE_ID,
                    titleLog: "CI direct fallback",
                    descriptionLog: "Dokploy queue did not complete",
                  });
                } catch {
                  process.exitCode = 1;
                }
              ' >/dev/null 2>&1
          }

          for i in $(seq 1 60); do
            sleep 10
            latest="$(curl -sS --fail -H "x-api-key: $DOKPLOY_TOKEN" \
              -G "$base/api/deployment.allByCompose" --data-urlencode "composeId=$COMPOSE_ID" \
              | jq -r --arg baseline "$DOKPLOY_DEPLOY_BASELINE" \
                '[.[] | select(.createdAt > $baseline)] | sort_by(.createdAt) | last | .status // "queued"')"
            echo "current deployment status: $latest"
            if [ "$latest" = "done" ]; then exit 0; fi
            if deployment_is_live; then
              echo "::warning::Dokploy status is $latest, but the exact Bunkhouse image and all live gates are healthy."
              exit 0
            fi
            if [ "$latest" = "error" ]; then
              echo "::warning::Dokploy queue reported an error; trying the compose-scoped fallback."
              break
            fi
            if [ "$latest" = "queued" ] && [ "$i" -ge 6 ]; then
              echo "::warning::Dokploy queue has not started after one minute; trying the compose-scoped fallback."
              break
            fi
          done

          if deploy_compose_directly; then
            echo "Compose-scoped fallback returned successfully."
          else
            echo "::warning::Compose-scoped fallback returned non-zero; checking whether Swarm recovered the tasks."
          fi
          for _ in $(seq 1 60); do
            sleep 5
            if deployment_is_live; then
              echo "Exact Bunkhouse image, replicas, and public health verified."
              exit 0
            fi
          done
          echo "::error::The exact Bunkhouse image did not become healthy after the compose-scoped fallback."
          exit 1

      - name: Production health gate
        env:
          PUBLIC_URL: ${{ vars.BUNKHOUSE_PUBLIC_URL }}
        run: |
          set -euo pipefail
          if [ -z "${PUBLIC_URL:-}" ]; then
            echo "::warning::repository variable BUNKHOUSE_PUBLIC_URL is not set — skipping the health check."
            exit 0
          fi
          host="${PUBLIC_URL#*://}"
          for i in $(seq 1 120); do
            sleep 5
            code="$(curl -s -o /dev/null -w '%{http_code}' "${PUBLIC_URL%/}/login" || true)"
            echo "https status: $code"
            if [ "$code" = "200" ]; then
              echo "$host is serving"
              exit 0
            fi
          done
          echo "::error::The deployed application did not become healthy within 10 minutes."
          exit 1
