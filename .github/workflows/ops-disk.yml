name: Ops — disk and storage

# Run by hand from the Actions tab (or `gh workflow run ops-disk.yml`).
# The deploy runner lives on the Dokploy manager, so this is the auditable way
# to inspect and tidy that host. Every destructive action is opt-in and named
# explicitly — there is no wildcard delete here, and volumes are never pruned
# in bulk: a stopped stack's volume looks "unused", and that is how data gets
# destroyed. Dokploy's own cleanup excludes them for the same reason.

on:
  workflow_dispatch:
    inputs:
      prune:
        description: 'Prune images, stopped containers, build cache (never volumes)'
        type: boolean
        default: false
      removeVolume:
        description: 'Remove ONE volume by exact name (leave blank to skip)'
        type: string
        default: ''
      nasMkdir:
        description: 'Create this directory under the NAS dokploy-storage export (leave blank to skip)'
        type: string
        default: ''
      dokployLogFor:
        description: 'Print the newest Dokploy deploy log for this appName (leave blank to skip)'
        type: string
        default: ''
      spendReportHours:
        description: 'Where the money went: run a read-only spend and activity report over the last N hours (blank to skip)'
        type: string
        default: ''
      checkSandbox:
        description: 'Check the agent shell sandbox can actually build a namespace'
        type: boolean
        default: false
      callReportFor:
        description: 'Replay one call second by second for this agent name (blank to skip)'
        type: string
        default: ''
      callsBack:
        description: 'Which call to replay: 1 is the latest, 2 the one before it'
        type: string
        default: '1'
      checkShellEndToEnd:
        description: 'From the app container, reach the shell sandbox and run a real command through it'
        type: boolean
        default: false
      tidyAgents:
        description: 'Agent housekeeping: DRY RUN counts only, unless tidyApply is also ticked'
        type: boolean
        default: false
      tidyPurge:
        description: 'DEV ONLY — actually DELETE all assignments and pending approvals'
        type: boolean
        default: false
      tidyApply:
        description: 'Actually apply the housekeeping above (retires notes, cancels queued work)'
        type: boolean
        default: false
      checkStorage:
        description: 'Show the SHAPE of the object-storage settings (masked) and test a real upload'
        type: boolean
        default: false
      serviceLogsFor:
        description: 'Print task history and recent logs for every swarm service matching this substring (leave blank to skip)'
        type: string
        default: ''
      reachFromWeb:
        description: 'From the web container, resolve and call these origins (comma-separated) — read-only'
        type: string
        default: ''
      setComposeEnv:
        description: 'Upsert ONE variable on the bunkhouse compose as KEY=VALUE, then redeploy (leave blank to skip)'
        type: string
        default: ''
      checkMedia:
        description: 'Whether LiveKit media is reachable: node address, host interfaces, and what is bound to 7881/7882'
        type: boolean
        default: false
      showComposeEnv:
        description: 'Print the bunkhouse compose environment — keys always, values only for known non-secret settings'
        type: boolean
        default: false
      stunFromWeb:
        description: 'From the web container, send a STUN binding request to host:port (e.g. 10.0.0.101:7882)'
        type: string
        default: ''
      forceRecreateService:
        description: 'Force-recreate every swarm service matching this substring (brief restart, rebuilds its port bindings)'
        type: string
        default: ''
      clearOrphanMediaNat:
        description: 'Remove DNAT rules on 7881/7882 that point at an address no running container holds'
        type: boolean
        default: false
      updateRunners:
        description: 'Pull the newest runner image and recreate EVERY shared GitHub runner on this host (interrupts any job they are running)'
        type: boolean
        default: false
      traefikReport:
        description: 'Show Traefik TCP routers and services from its local read-only API'
        type: boolean
        default: false
      turnProbe:
        description: 'Send a real STUN request to TURN directly and through public TURN/TLS'
        type: boolean
        default: false

# Where this deployment's durable storage lives. Repository variables rather
# than literals: this file is written to be public, and one company's NFS
# export is not part of the product.
env:
  NAS_EXPORT_OPTS: 'addr=${{ vars.BUNKHOUSE_NFS_ADDR }},nfsvers=4,rw,hard,timeo=600'
  NAS_EXPORT_DEVICE: ${{ vars.BUNKHOUSE_NAS_EXPORT_ROOT }}

jobs:
  ops:
    runs-on: [self-hosted, linux, x64, dokploy]
    timeout-minutes: 30
    steps:
      - name: Report
        run: |
          set -uo pipefail
          echo "::group::Filesystem"
          df -h
          echo "::endgroup::"
          if ! command -v docker >/dev/null 2>&1; then
            echo "::warning::No docker CLI on this runner — nothing here can run."
            exit 0
          fi
          echo "::group::Docker disk usage"
          docker system df || true
          echo "::endgroup::"
          echo "::group::Volumes (name, driver, and whether anything mounts it)"
          for v in $(docker volume ls -q); do
            users="$(docker ps -a --filter volume="$v" --format '{{.Names}}' | tr '\n' ' ')"
            driver="$(docker volume inspect "$v" --format '{{.Driver}}{{if .Options}} nfs:{{index .Options "device"}}{{end}}' 2>/dev/null)"
            printf '%-70s %-28s %s\n' "$v" "$driver" "${users:-(unused)}"
          done
          echo "::endgroup::"
          echo "::group::Largest images"
          docker images --format '{{.Size}}\t{{.Repository}}:{{.Tag}}' | sort -hr | head -20 || true
          echo "::endgroup::"

      # A call fails in two indistinguishable ways and only one is a bug in the
      # app: the agent answers and nobody hears anything either because the
      # caller is off the network the media address serves, or because that
      # address is not the node's at all. LiveKit advertises ONE address for
      # media and every candidate pair uses it, so if it is wrong, everyone
      # fails identically — including an agent on the same host, which is the
      # tell that separates the two.
      - name: Check LiveKit media reachability
        if: ${{ inputs.checkMedia }}
        run: |
          set -uo pipefail
          echo "::group::Swarm node addresses"
          docker node ls --format '{{.Hostname}}  status={{.Status}}  manager={{.ManagerStatus}}' 2>&1 || true
          docker node inspect $(docker node ls -q) --format 'node: hostname={{.Description.Hostname}} advertised={{.Status.Addr}}' 2>&1 || true
          echo "::endgroup::"
          echo "::group::Host interfaces and media port bindings"
          docker run --rm --net=host alpine:3 sh -c \
            "ip -4 -o addr show | awk '{print \"  iface \"\$2\" \"\$4}'; \
             echo '--- listening on the media ports, with the owning process ---'; \
             (netstat -lntup 2>/dev/null || ss -lntup 2>/dev/null) | grep -E ':(7881|7882)' || echo '  NOTHING bound to 7881/7882'"
          echo "::endgroup::"
          # Bound is not the same as reachable. If loopback answers and the LAN
          # address does not, the socket is fine and something between them is
          # dropping packets — host-mode publishing binds the host directly, so
          # unlike bridge publishing it gets no automatic firewall exemption.
          echo "::group::Reachable on loopback versus the LAN address"
          docker run --rm --net=host alpine:3 sh -c \
            "apk add -q --no-cache netcat-openbsd >/dev/null 2>&1; \
             for target in 127.0.0.1 10.0.0.101; do \
               printf '  %-12s tcp/7881 ' \$target; \
               nc -z -w 3 \$target 7881 && echo OPEN || echo BLOCKED; \
             done"
          echo "::endgroup::"
          # The setting that decides whether ICE can work at all. `mode: host`
          # in the compose is a request; this is what the swarm actually did.
          echo "::group::How the media ports are published, as running"
          for svc in $(docker service ls --format '{{.Name}}' | grep -E '_livekit$' || true); do
            echo "  $svc"
            docker service inspect "$svc" \
              --format '{{range .Endpoint.Ports}}    {{.Protocol}}/{{.PublishedPort}} -> {{.TargetPort}}  mode={{.PublishMode}}{{"\n"}}{{end}}' 2>&1 || true
          done
          echo "::endgroup::"
          echo "::group::Firewall"
          docker run --rm --net=host --privileged alpine:3 sh -c "apk add -q --no-cache iptables ip6tables nftables >/dev/null 2>&1; echo '--- INPUT policy and rules ---'; iptables -S INPUT || echo 'iptables unavailable'; echo '--- nftables input chains ---'; nft list ruleset 2>/dev/null | grep -A6 -E 'chain input' | head -40 || echo 'no nftables ruleset'; echo '--- anything mentioning the media ports ---'; iptables -S | grep -E '7881|7882' || echo 'no rule'; echo '--- NAT: what rewrites the media ports ---'; iptables -t nat -S | grep -E '7881|7882' || echo 'no NAT rule'"
          echo "::endgroup::"
          echo "::group::Which container holds the address the NAT points at"
          docker ps --format '{{.Names}}' | while read c; do
            addr=$(docker inspect "$c" --format '{{range .NetworkSettings.Networks}}{{.IPAddress}} {{end}}' 2>/dev/null)
            case "$addr" in *172.18.0.27*) echo "  172.18.0.27 -> $c" ;; esac
          done
          echo "  (nothing listed means the address belongs to no running container)"
          echo "::endgroup::"

      # What the deployment actually carries, as opposed to what the compose
      # file defaults to. A setting that quietly reverted to its default is
      # invisible from the file and from the application, and reads as a
      # network problem rather than a configuration one.
      - name: Show the compose environment
        if: ${{ inputs.showComposeEnv }}
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
        run: |
          set -euo pipefail
          base="${DOKPLOY_URL%/}"
          current="$(curl -sS --fail -H "x-api-key: $DOKPLOY_TOKEN" \
            -G "$base/api/compose.one" --data-urlencode "composeId=$COMPOSE_ID" \
          )"
          echo "::group::Managed domains"
          echo "$current" | jq '{composeId, name, appName, composeType, domains: ((.domains // []) | map({domainId, host, port, serviceName, https, certificateType}))}'
          echo "::endgroup::"
          echo "$current" | jq -r '.env // ""' \
            | awk -F= 'NF>1 {
                key=$1; val=substr($0, index($0,"=")+1);
                safe = (key ~ /^(BUNKHOUSE_TAG|LIVEKIT_NODE_IP|LIVEKIT_URL|APPKIT_STORAGE_ENDPOINT|APPKIT_STORAGE_BUCKET|BUNKHOUSE_NFS_ADDR|BUNKHOUSE_NFS_EXPORT|APP_URL|ADMIN_EMAIL)$/);
                if (safe) printf "  %-32s = %s\n", key, val;
                else printf "  %-32s = <set, %d chars>\n", key, length(val);
              }'

      # Host-mode publishing binds the host directly and creates no NAT. A DNAT
      # rule for the same port is therefore a leftover from when the port was
      # published in bridge mode, and it wins: traffic arriving from off the
      # host is rewritten to an address that no longer exists and dropped, while
      # loopback still answers because it never traverses that path. From the
      # outside it is indistinguishable from a firewall, and from the
      # application it is "wait_pc_connection timed out".
      #
      # Only rules whose destination belongs to no running container are
      # touched, so a live bridge publish is never disturbed.
      - name: Clear orphaned media NAT
        if: ${{ inputs.clearOrphanMediaNat }}
        run: |
          set -uo pipefail
          live="$(docker ps -q | xargs -r docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}} {{end}}' 2>/dev/null | tr ' ' '\n' | sort -u)"
          rules="$(docker run --rm --net=host --privileged alpine:3 sh -c "apk add -q --no-cache iptables >/dev/null 2>&1; iptables -t nat -S DOCKER | grep -E 'dport (7881|7882) .*DNAT'" || true)"
          if [ -z "$rules" ]; then echo "No DNAT rules on the media ports — nothing to do."; exit 0; fi
          echo "$rules" | while read -r rule; do
            target="$(echo "$rule" | sed -n 's/.*--to-destination \([0-9.]*\):.*/\1/p')"
            if echo "$live" | grep -qx "$target"; then
              echo "KEEPING (live container at $target): $rule"
              continue
            fi
            echo "REMOVING (no container at $target): $rule"
            del="$(echo "$rule" | sed 's/^-A /-D /')"
            docker run --rm --net=host --privileged alpine:3 sh -c "apk add -q --no-cache iptables >/dev/null 2>&1; iptables -t nat $del" && echo "  removed" || echo "  FAILED"
          done
          echo "--- NAT on the media ports after ---"
          docker run --rm --net=host --privileged alpine:3 sh -c "apk add -q --no-cache iptables >/dev/null 2>&1; iptables -t nat -S | grep -E '7881|7882' || echo '  none remain'"

      # Whether a container can reach the media port on the host's own address.
      # LiveKit advertises one address for media; a container reaching it goes
      # out over the gateway bridge and back into the host, and that hairpin is
      # not guaranteed for UDP. If it fails, the agent can never complete ICE
      # even though it runs on the same machine — which is invisible from the
      # application, and looks exactly like a caller-side network problem.
      - name: STUN from the web container
        if: ${{ inputs.stunFromWeb != '' }}
        run: |
          set -uo pipefail
          case "${{ inputs.stunFromWeb }}" in *[!0-9.:,]*) echo "::error::Refusing suspicious target"; exit 1 ;; esac
          cid="$(docker ps --filter 'name=_web' --filter 'status=running' --format '{{.ID}}' | head -1)"
          if [ -z "$cid" ]; then echo "::error::No running web container"; exit 1; fi
          docker exec -e TARGETS="${{ inputs.stunFromWeb }}" "$cid" node -e '
            const dgram = require("node:dgram");
            const probe = (hostport) => new Promise((resolve) => {
              const [host, port] = hostport.split(":");
              const sock = dgram.createSocket("udp4");
              const msg = Buffer.concat([Buffer.from([0,1,0,0,0x21,0x12,0xa4,0x42]), require("node:crypto").randomBytes(12)]);
              const done = (text) => { try { sock.close() } catch {} ; console.log("  " + hostport.padEnd(22) + text); resolve() };
              const timer = setTimeout(() => done("NO RESPONSE (timed out)"), 6000);
              sock.on("message", (d) => { clearTimeout(timer); done("REPLIED " + d.length + " bytes") });
              sock.on("error", (e) => { clearTimeout(timer); done("FAILED (" + e.code + ")") });
              sock.send(msg, Number(port), host);
            });
            (async () => { for (const t of (process.env.TARGETS || "").split(",")) if (t.trim()) await probe(t.trim()) })();
          '

      # The last thing that separates a network problem from a LiveKit problem.
      # If the media port will not answer a STUN binding request from the node
      # itself, nothing about the network is at fault and the socket is not
      # serving ICE at all.
      # The last check that separates a network problem from a LiveKit one. If
      # the media port will not answer a STUN binding request from the node
      # itself, there is no path left to blame and the socket is not serving ICE.
      - name: STUN the media port from the node
        if: ${{ inputs.checkMedia }}
        run: |
          set -uo pipefail
          for target in 127.0.0.1 10.0.0.101; do
            printf '  %-14s udp/7882 ' "$target"
            docker run --rm --net=host python:3-alpine python3 -c "import socket,struct,os;s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM);s.settimeout(5);s.sendto(struct.pack('>HHI',1,0,0x2112A442)+os.urandom(12),('$target',7882));d,a=s.recvfrom(2048);print('REPLIED',len(d),'bytes')" 2>/dev/null || echo "NO RESPONSE"
          done

      # Rebuilding a service's port bindings from scratch. Docker keeps host
      # port state per task, and a task that outlived a change in publish mode
      # leaves bindings that no longer match the service — the port answers,
      # but not from the process that is supposed to own it. Recreating the
      # task is what makes the daemon tear the old state down.
      - name: Force-recreate a service
        if: ${{ inputs.forceRecreateService != '' }}
        run: |
          set -uo pipefail
          match="${{ inputs.forceRecreateService }}"
          case "$match" in *[!a-zA-Z0-9_.-]*) echo "::error::Refusing suspicious service name"; exit 1 ;; esac
          found=0
          for svc in $(docker service ls --format '{{.Name}}' | grep -i -- "$match" || true); do
            found=1
            echo "recreating $svc"
            docker service update --force --detach=false "$svc" 2>&1 | tail -3
            docker service ps --no-trunc "$svc" 2>&1 | head -4
          done
          [ "$found" = 1 ] || echo "No service matched '$match'."

      - name: Read the newest Dokploy deployment log
        if: ${{ inputs.dokployLogFor != '' }}
        run: |
          set -euo pipefail
          app="${{ inputs.dokployLogFor }}"
          case "$app" in */*|*..*) echo "::error::Refusing suspicious appName"; exit 1 ;; esac
          # Deploy logs live on the host; a bind mount reads them without a shell there.
          docker run --rm -v /etc/dokploy/logs:/logs:ro alpine:3 sh -c \
            "ls -1t /logs/$app 2>/dev/null | head -3; echo '--- newest ---'; f=\$(ls -1t /logs/$app 2>/dev/null | head -1); [ -n \"\$f\" ] && tail -80 \"/logs/$app/\$f\" || echo 'no logs found'"

      # Why a task history and not just logs: a container the swarm killed for
      # exceeding its memory limit leaves nothing in its own log — the evidence
      # is the task's exit state (137) and the string of restarts above it.
      - name: Read swarm service state and logs
        if: ${{ inputs.serviceLogsFor != '' }}
        run: |
          set -uo pipefail
          match="${{ inputs.serviceLogsFor }}"
          case "$match" in *[!a-zA-Z0-9_.-]*) echo "::error::Refusing suspicious service name"; exit 1 ;; esac
          found=0
          for svc in $(docker service ls --format '{{.Name}}' | grep -i -- "$match" || true); do
            found=1
            echo "::group::$svc — tasks"
            docker service ps --no-trunc "$svc" 2>&1 | head -20
            echo "::endgroup::"
            echo "::group::$svc — resources"
            docker service inspect "$svc" \
              --format 'image={{.Spec.TaskTemplate.ContainerSpec.Image}}{{"\n"}}memLimit={{with .Spec.TaskTemplate.Resources.Limits}}{{.MemoryBytes}}{{else}}none{{end}}{{"\n"}}command={{.Spec.TaskTemplate.ContainerSpec.Args}}{{"\n"}}serviceLabels={{json .Spec.Labels}}{{"\n"}}containerLabels={{json .Spec.TaskTemplate.ContainerSpec.Labels}}{{"\n"}}networks={{json .Spec.TaskTemplate.Networks}}' 2>&1 || echo 'resources: unavailable'
            echo "::endgroup::"
            echo "::group::$svc — last 1200 log lines"
            docker service logs --tail 1200 --timestamps "$svc" 2>&1 | tail -1200
            echo "::endgroup::"
          done
          # Not everything here is a swarm service any more. The agent shell
          # sandbox is deployed as a plain Compose application on purpose —
          # swarm silently drops the security options bubblewrap needs — so
          # `docker service ls` cannot see it and this looked, wrongly, like a
          # deployment that had not happened.
          for ctr in $(docker ps --format '{{.Names}}' | grep -i -- "$match" || true); do
            found=1
            echo "::group::$ctr — container (not a swarm service)"
            docker ps --filter "name=$ctr" --format 'image={{.Image}}  status={{.Status}}'
            docker inspect "$ctr" --format 'capAdd={{.HostConfig.CapAdd}} securityOpt={{.HostConfig.SecurityOpt}}' 2>&1 || true
            echo "::endgroup::"
            echo "::group::$ctr — last 400 log lines"
            docker logs --tail 400 --timestamps "$ctr" 2>&1 | tail -400
            echo "::endgroup::"
          done
          [ "$found" = 1 ] || echo "::warning::Nothing here matches '$match'"

      - name: Show Traefik TCP routing state
        if: ${{ inputs.traefikReport }}
        run: |
          set -uo pipefail
          cid="$(docker ps --filter 'name=traefik' --filter 'status=running' --format '{{.ID}}' | head -1)"
          if [ -z "$cid" ]; then echo "::error::No running Traefik container"; exit 1; fi
          for endpoint in tcp/routers tcp/services; do
            echo "::group::Traefik API — $endpoint"
            docker run --rm --network "container:$cid" alpine:3 \
              wget -qO- "http://127.0.0.1:8080/api/$endpoint" 2>&1 \
              | sed 's/},{/},\n{/g'
            echo
            echo "::endgroup::"
          done

      # A TCP connect only proves that something accepted a socket. This sends
      # a protocol-valid STUN binding request, first as plaintext to the TURN
      # service (external_tls means this is exactly what LiveKit expects), then
      # through the public TLS/SNI route. Both must return binding success.
      - name: Probe TURN protocol end to end
        if: ${{ inputs.turnProbe }}
        run: |
          set -uo pipefail
          cid="$(docker ps --filter 'name=_web' --filter 'status=running' --format '{{.ID}}' | head -1)"
          if [ -z "$cid" ]; then echo "::error::No running web container"; exit 1; fi
          livekit_cid="$(docker ps --filter 'name=_livekit.' --filter 'status=running' --format '{{.ID}}' | head -1)"
          if [ -z "$livekit_cid" ]; then echo "::error::No running LiveKit container"; exit 1; fi
          backend="$(docker inspect "$livekit_cid" --format '{{with index .NetworkSettings.Networks "dokploy-network"}}{{.IPAddress}}{{end}}')"
          traefik_cid="$(docker ps --filter 'name=traefik' --filter 'status=running' --format '{{.ID}}' | head -1)"
          if [ -z "$traefik_cid" ]; then echo "::error::No running Traefik container"; exit 1; fi
          traefik_backend="$(docker inspect "$traefik_cid" --format '{{with index .NetworkSettings.Networks "dokploy-network"}}{{.IPAddress}}{{end}}')"
          docker exec -e TURN_BACKEND="$backend" -e TRAEFIK_BACKEND="$traefik_backend" "$cid" node -e '
            const net = require("node:net");
            const tls = require("node:tls");
            const crypto = require("node:crypto");
            const request = Buffer.alloc(20);
            request.writeUInt16BE(0x0001, 0);
            request.writeUInt16BE(0, 2);
            request.writeUInt32BE(0x2112a442, 4);
            crypto.randomFillSync(request, 8, 12);

            function probe(label, connect) {
              return new Promise((resolve) => {
                let settled = false;
                const socket = connect();
                const finish = (ok, detail) => {
                  if (settled) return;
                  settled = true;
                  clearTimeout(timer);
                  socket.destroy();
                  console.log(`  ${label.padEnd(26)} ${ok ? "OK" : "FAILED"} — ${detail}`);
                  resolve(ok);
                };
                const timer = setTimeout(() => finish(false, "no STUN response in 8s"), 8000);
                socket.once("error", (error) => finish(false, `${error.code || error.name}: ${error.message}`));
                socket.once("secureConnect", () => socket.write(request));
                socket.once("connect", () => {
                  if (!(socket instanceof tls.TLSSocket)) socket.write(request);
                });
                socket.once("data", (data) => {
                  if (data.length < 20) return finish(false, `short response (${data.length} bytes)`);
                  const type = data.readUInt16BE(0);
                  const cookie = data.readUInt32BE(4);
                  const sameTransaction = data.subarray(8, 20).equals(request.subarray(8, 20));
                  finish(type === 0x0101 && cookie === 0x2112a442 && sameTransaction,
                    `type=0x${type.toString(16).padStart(4, "0")}, ${data.length} bytes, transaction=${sameTransaction ? "matched" : "wrong"}`);
                });
              });
            }

            (async () => {
              const tlsProbe = (label, host) => probe(label, () => tls.connect({
                host,
                port: 443,
                servername: "bunkhouse-turn.cloud.rassaun.com",
                rejectUnauthorized: true,
              }));
              const direct = await probe("livekit:443 plaintext", () => net.connect(443, "livekit"));
              const task = await probe("LiveKit task IP plaintext", () => net.connect(443, process.env.TURN_BACKEND));
              const traefik = await tlsProbe("Traefik overlay TURN/TLS", process.env.TRAEFIK_BACKEND);
              const manager = await tlsProbe("manager 443 TURN/TLS", "10.0.0.101");
              const routed = await tlsProbe("public TURN/TLS", "bunkhouse-turn.cloud.rassaun.com");
              if (!direct || !task || !traefik || !manager || !routed) process.exitCode = 1;
            })();
          '

      # Answering "what were the agents doing all night, and what did it cost"
      # needs the whole night at once, which the observatory cannot show. The
      # report runs INSIDE the running web container so the database URL stays
      # where it already is — nothing here handles a secret, and the query is
      # read-only aggregates with no message bodies or addresses in it.
      - name: Spend and activity report
        if: ${{ inputs.spendReportHours != '' }}
        run: |
          set -uo pipefail
          hours="${{ inputs.spendReportHours }}"
          case "$hours" in ''|*[!0-9]*) echo "::error::Hours must be a whole number"; exit 1 ;; esac
          cid="$(docker ps --filter 'name=_web' --filter 'status=running' --format '{{.ID}}' | head -1)"
          if [ -z "$cid" ]; then echo "::error::No running web container on this node"; exit 1; fi
          # Same condition the worker and voice agent run under: the db client
          # is a server module and refuses to load without it.
          docker exec -e NODE_OPTIONS=--conditions=react-server "$cid" \
            apps/web/node_modules/.bin/tsx apps/web/scripts/spend-report.mts "$hours"

      # `run_shell` is only as real as the sandbox it runs in. When the
      # container cannot create a user namespace, bubblewrap refuses and every
      # shell command an agent tries fails with the same line — which is what
      # sent them back to leaving each other notes instead of doing the work.
      - name: Check the agent shell sandbox
        if: ${{ inputs.checkSandbox }}
        run: |
          set -uo pipefail
          cid="$(docker ps --filter 'name=_web' --filter 'status=running' --format '{{.ID}}' | head -1)"
          if [ -z "$cid" ]; then echo "::error::No running web container on this node"; exit 1; fi
          # Binding the whole rootfs read-only means every path the command
          # needs exists, so the only thing this can fail on is building the
          # sandbox — which is the question. Two earlier versions of this probe
          # failed on their own missing symlinks and were read as refusals.
          probe='bwrap --unshare-user --unshare-pid --ro-bind / / --dev /dev --chdir / -- /bin/true'
          echo "bwrap: $(docker exec "$cid" bwrap --version 2>&1 || echo 'not installed')"
          echo "--- what the swarm actually granted (it silently drops some of what compose asks for) ---"
          svc="$(docker ps --filter "id=$cid" --format '{{.Label "com.docker.swarm.service.name"}}')"
          [ -n "$svc" ] && docker service inspect "$svc" --format 'seccomp={{with .Spec.TaskTemplate.ContainerSpec.Privileges}}{{.Seccomp}}{{else}}none{{end}} apparmor={{with .Spec.TaskTemplate.ContainerSpec.Privileges}}{{.AppArmor}}{{else}}none{{end}} capAdd={{.Spec.TaskTemplate.ContainerSpec.CapabilityAdd}}' 2>&1 || true
          echo "--- kernel switches this needs ---"
          docker exec "$cid" sh -c 'for f in /proc/sys/kernel/unprivileged_userns_clone /proc/sys/user/max_user_namespaces; do [ -r "$f" ] && echo "$f = $(cat $f)"; done' 2>&1 || true
          echo "--- can a user namespace be made at all ---"
          docker exec "$cid" sh -c "$probe" 2>&1 \
            && echo "userns: OK" || echo "userns: refused above"
          echo "--- which confinement is refusing: run the same probe outside the swarm ---"
          img="$(docker inspect "$cid" --format '{{.Config.Image}}')"
          echo "apparmor profile in the service container: $(docker exec "$cid" cat /proc/self/attr/current 2>&1 || echo unknown)"
          echo "apparmor enabled on host: $(docker exec "$cid" cat /sys/module/apparmor/parameters/enabled 2>&1 || echo unknown)"
          echo "> which single option is enough (probe now matches the real sandbox):"
          for opt in "apparmor=unconfined" "seccomp=unconfined"; do
            if docker run --rm --cap-add SYS_ADMIN --security-opt "$opt" "$img" sh -c "$probe" >/dev/null 2>&1; then
              echo "   CAP_SYS_ADMIN + $opt  -> WORKS"
            else
              echo "   CAP_SYS_ADMIN + $opt  -> refused"
            fi
          done
          if docker run --rm --security-opt apparmor=unconfined --security-opt seccomp=unconfined "$img" sh -c "$probe" >/dev/null 2>&1; then
            echo "   both, no CAP_SYS_ADMIN -> WORKS"
          else
            echo "   both, no CAP_SYS_ADMIN -> refused"
          fi
          if docker run --rm --cap-add SYS_ADMIN --security-opt apparmor=unconfined --security-opt seccomp=unconfined "$img" sh -c "$probe" >/dev/null 2>&1; then
            echo "   CAP_SYS_ADMIN + both   -> WORKS"
          else
            echo "   CAP_SYS_ADMIN + both   -> refused"
          fi
          echo "--- the full set the workspace sandbox asks for ---"
          if docker exec "$cid" sh -c "$probe" 2>&1; then
            echo "namespace: OK — the sandbox can be built, run_shell works"
          else
            echo "::warning::namespace: REFUSED — bubblewrap cannot build a sandbox here, so run_shell will fail"
          fi

      # A call that felt wrong cannot be diagnosed from the transcript or the
      # ledger alone — the answer is always in the gap between them, which is
      # why this prints both on one clock.
      - name: Replay one call
        if: ${{ inputs.callReportFor != '' }}
        run: |
          set -uo pipefail
          who="${{ inputs.callReportFor }}"
          back="${{ inputs.callsBack }}"
          case "$who" in *[!a-zA-Z0-9_.\ -]*) echo "::error::Refusing suspicious name"; exit 1 ;; esac
          case "$back" in ''|*[!0-9]*) echo "::error::callsBack must be a whole number"; exit 1 ;; esac
          cid="$(docker ps --filter 'name=_web' --filter 'status=running' --format '{{.ID}}' | head -1)"
          if [ -z "$cid" ]; then echo "::error::No running web container on this node"; exit 1; fi
          docker exec -e NODE_OPTIONS=--conditions=react-server "$cid" \
            apps/web/node_modules/.bin/tsx apps/web/scripts/call-report.mts "$who" "$back"

      # MinIO refused the recording upload with "invalid hostname", which is a
      # complaint about the endpoint rather than about credentials or the
      # bucket. The value itself is deployment infrastructure and this log is
      # public, so only its SHAPE is printed — scheme, host pattern, port,
      # path — which is all that distinguishes a malformed endpoint from a
      # working one.
      - name: Check object storage settings
        if: ${{ inputs.checkStorage }}
        run: |
          set -uo pipefail
          cid="$(docker ps --filter 'name=_web' --filter 'status=running' --format '{{.ID}}' | head -1)"
          if [ -z "$cid" ]; then echo "::error::No running web container on this node"; exit 1; fi
          docker exec "$cid" node -e '
            const mask = (value) => {
              if (!value) return "(unset)";
              try {
                const u = new URL(value);
                const host = u.hostname.split(".").map((p) => "*".repeat(p.length)).join(".");
                return `${u.protocol}//${host}${u.port ? ":" + u.port : ""}${u.pathname === "/" ? "" : u.pathname}`;
              } catch {
                return `NOT A URL (${value.length} chars, starts ${JSON.stringify(value.slice(0, 8))})`;
              }
            };
            console.log("endpoint shape :", mask(process.env.APPKIT_STORAGE_ENDPOINT));
            try {
              const h = new URL(process.env.APPKIT_STORAGE_ENDPOINT).hostname;
              const legal = /^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)*$/i.test(h);
              console.log("host underscores:", (h.match(/_/g) || []).length);
              console.log("host dots      :", (h.match(/\\./g) || []).length);
              console.log("legal hostname :", legal, legal ? "" : "<-- a Host header MinIO refuses");
            } catch {}
            console.log("bucket         :", process.env.APPKIT_STORAGE_BUCKET ?? "(unset)");
            console.log("region         :", process.env.APPKIT_STORAGE_REGION ?? "(unset, defaults us-east-1)");
            console.log("forcePathStyle :", process.env.APPKIT_STORAGE_FORCE_PATH_STYLE ?? "(unset, defaults true)");
            console.log("key id set     :", Boolean(process.env.APPKIT_STORAGE_ACCESS_KEY_ID));
            console.log("secret set     :", Boolean(process.env.APPKIT_STORAGE_SECRET_ACCESS_KEY));
          '
          # The shape above is necessary and not sufficient: settings that read
          # perfectly still failed for three days because the endpoint host held
          # an underscore, which resolves, connects, and is then refused at the
          # HTTP layer. Only a real round trip tells the two apart — and it has
          # to run here, in the container, over the credentials the app uses.
          # Signed by hand rather than through the SDK: the app image is a Next
          # standalone build, where @aws-sdk is bundled somewhere `node -e` in
          # /app cannot require. SigV4 over fetch needs nothing but node, so
          # this keeps working whatever the bundler does next.
          docker exec "$cid" node -e '
            const { createHash, createHmac } = require("crypto");
            const sha = (b) => createHash("sha256").update(b).digest("hex");
            const hmac = (k, s) => createHmac("sha256", k).update(s).digest();
            async function s3(method, key, body) {
              const endpoint = process.env.APPKIT_STORAGE_ENDPOINT.replace(/\/$/, "");
              const region = process.env.APPKIT_STORAGE_REGION || "us-east-1";
              const url = new URL(endpoint + "/" + process.env.APPKIT_STORAGE_BUCKET + "/" + key);
              const payload = body || Buffer.alloc(0);
              const hash = sha(payload);
              const now = new Date().toISOString().replace(/[:-]|\.\d{3}/g, "");
              const date = now.slice(0, 8);
              const host = url.port ? url.hostname + ":" + url.port : url.hostname;
              const signed = "host;x-amz-content-sha256;x-amz-date";
              const canonical = [method, url.pathname, "",
                "host:" + host + "\nx-amz-content-sha256:" + hash + "\nx-amz-date:" + now + "\n",
                signed, hash].join("\n");
              const scope = date + "/" + region + "/s3/aws4_request";
              const toSign = ["AWS4-HMAC-SHA256", now, scope, sha(canonical)].join("\n");
              let k = hmac("AWS4" + process.env.APPKIT_STORAGE_SECRET_ACCESS_KEY, date);
              for (const part of [region, "s3", "aws4_request"]) k = hmac(k, part);
              const sig = createHmac("sha256", k).update(toSign).digest("hex");
              const headers = { host, "x-amz-date": now, "x-amz-content-sha256": hash,
                authorization: "AWS4-HMAC-SHA256 Credential=" + process.env.APPKIT_STORAGE_ACCESS_KEY_ID +
                  "/" + scope + ", SignedHeaders=" + signed + ", Signature=" + sig };
              if (method === "PUT") headers["content-length"] = String(payload.length);
              return fetch(url, { method, headers, body: method === "PUT" ? payload : undefined,
                signal: AbortSignal.timeout(15000) });
            }
            const key = "_ops/roundtrip-check";
            const body = Buffer.alloc(64 * 1024, 0x41);
            (async () => {
              try {
                const put = await s3("PUT", key, body);
                if (!put.ok) throw new Error("PUT " + put.status + " " + (await put.text()).slice(0, 200));
                const got = await s3("GET", key);
                if (!got.ok) throw new Error("GET " + got.status);
                const back = Buffer.from(await got.arrayBuffer());
                await s3("DELETE", key);
                console.log("round trip     :", back.length === body.length
                  ? "OK (" + back.length + " bytes back)" : "MISMATCH (" + back.length + ")");
              } catch (error) {
                // No status and no body is itself the diagnosis: the request
                // never got a reply that could be parsed, which is what reaches
                // an agent as the bare string UnknownError.
                console.log("round trip     : FAILED");
                console.log("  reason       :", error.message || "(empty)");
                console.log("  cause        :", (error.cause && (error.cause.code || error.cause.message)) ||
                  "(none — no HTTP reply was parsed)");
                process.exitCode = 1;
              }
            })();
          '

      # The shell sandbox is a separate application on a shared network, so
      # "it works" has three parts: the app can resolve it, the token is
      # agreed, and a command actually runs inside the sandbox. Checked from
      # the app container, which is the only place that matters.
      - name: Check the agent shell end to end
        if: ${{ inputs.checkShellEndToEnd }}
        run: |
          set -uo pipefail
          cid="$(docker ps --filter 'name=_web' --filter 'status=running' --format '{{.ID}}' | head -1)"
          if [ -z "$cid" ]; then echo "::error::No running web container on this node"; exit 1; fi
          docker exec "$cid" node -e '
            const url = process.env.BUNKHOUSE_SHELL_URL;
            const token = process.env.BUNKHOUSE_SHELL_TOKEN;
            console.log("BUNKHOUSE_SHELL_URL :", url ?? "(unset)");
            console.log("token configured    :", Boolean(token));
            if (!url || !token) { console.log("not wired up yet"); process.exit(0); }
            const home = `${process.env.BUNKHOUSE_AGENT_HOMES ?? "/data/agent-homes"}/.opscheck`;
            (async () => {
              const health = await fetch(`${url}/health`).then((r) => r.status).catch((e) => `unreachable: ${e.message}`);
              console.log("health              :", health);
              const run = await fetch(`${url}/run`, {
                method: "POST",
                headers: { "content-type": "application/json", authorization: `Bearer ${token}` },
                body: JSON.stringify({ home, cwd: home, command: "echo hello from the sandbox; id -u; pwd" }),
              }).then((r) => r.json()).catch((e) => ({ status: "failed", output: e.message }));
              console.log("command status      :", run.status, "exit", run.exitCode);
              console.log("command output      :", JSON.stringify(run.output));
              // The boundary itself: a home outside the workspace root must be refused.
              const refused = await fetch(`${url}/run`, {
                method: "POST",
                headers: { "content-type": "application/json", authorization: `Bearer ${token}` },
                body: JSON.stringify({ home: "/etc", cwd: "/etc", command: "echo nope" }),
              }).then((r) => r.status).catch(() => "error");
              console.log("escape attempt      :", refused, refused === 403 ? "(refused, correct)" : "(SHOULD BE 403)");
              const noToken = await fetch(`${url}/run`, {
                method: "POST",
                headers: { "content-type": "application/json" },
                body: JSON.stringify({ home, cwd: home, command: "echo nope" }),
              }).then((r) => r.status).catch(() => "error");
              console.log("no token            :", noToken, noToken === 401 ? "(refused, correct)" : "(SHOULD BE 401)");
            })();
          '

      # Housekeeping on live data, so it counts first and only changes anything
      # when told twice. Nothing is deleted: notes are closed the way the app
      # closes them (valid_until), work is cancelled the way the app cancels
      # it. Everything stays readable afterwards.
      - name: Tidy the agents
        if: ${{ inputs.tidyAgents }}
        run: |
          set -uo pipefail
          cid="$(docker ps --filter 'name=_web' --filter 'status=running' --format '{{.ID}}' | head -1)"
          if [ -z "$cid" ]; then echo "::error::No running web container on this node"; exit 1; fi
          docker exec -e NODE_OPTIONS=--conditions=react-server \
            -e TIDY_APPLY="${{ inputs.tidyApply }}" -e TIDY_PURGE="${{ inputs.tidyPurge }}" "$cid" \
            apps/web/node_modules/.bin/tsx apps/web/scripts/tidy-agents.mts

      - name: Create NAS directory
        if: ${{ inputs.nasMkdir != '' }}
        run: |
          set -euo pipefail
          target="${{ inputs.nasMkdir }}"
          case "$target" in
            */..*|/*|'') echo "::error::Refusing suspicious path '$target'"; exit 1 ;;
          esac
          # Empty here would mount the wrong export, or none, and then create a
          # directory somewhere nobody meant. Name the missing variable instead.
          : "${NAS_EXPORT_DEVICE:?repository variable BUNKHOUSE_NAS_EXPORT_ROOT is not set}"
          vol="ops-nas-root-$$"
          docker volume create --driver local \
            --opt type=nfs --opt o="$NAS_EXPORT_OPTS" --opt device="$NAS_EXPORT_DEVICE" "$vol"
          trap 'docker volume rm -f "$vol" >/dev/null 2>&1 || true' EXIT
          docker run --rm -v "$vol":/nas alpine:3 sh -c "mkdir -p '/nas/$target' && ls -la /nas"
          echo "Created (or already present): $NAS_EXPORT_DEVICE/$target"

      - name: Remove one volume by exact name
        if: ${{ inputs.removeVolume != '' }}
        run: |
          set -euo pipefail
          target="${{ inputs.removeVolume }}"
          echo "Requested removal: $target"
          if ! docker volume inspect "$target" >/dev/null 2>&1; then
            echo "::warning::No such volume — nothing to do."
            exit 0
          fi
          echo "::group::What it is"
          docker volume inspect "$target"
          echo "--- contents (what removal would destroy) ---"
          docker run --rm -v "$target":/v:ro alpine:3 sh -c 'find /v -maxdepth 3 | head -40; echo "--- size ---"; du -sh /v' || true
          echo "::endgroup::"
          users="$(docker ps -a --filter volume="$target" --format '{{.Names}}' | tr '\n' ' ')"
          if [ -n "$users" ]; then
            echo "::error::In use by: $users — refusing to remove."
            exit 1
          fi
          docker volume rm "$target"
          echo "Removed $target"

      # Which address the app can actually use, asked from where it matters.
      # A storage endpoint fails three distinguishable ways and only one of them
      # is "down": the name may not resolve, it may resolve and refuse the
      # connection, or it may connect and be rejected at the HTTP layer — which
      # is what an underscore in a service name does, because Docker DNS
      # resolves it happily and MinIO then refuses the illegal Host header. The
      # S3 client reports that last case as an error with no status and no code,
      # so the difference is invisible from the application side.
      - name: Reach an origin from the web container
        if: ${{ inputs.reachFromWeb != '' }}
        run: |
          set -uo pipefail
          case "${{ inputs.reachFromWeb }}" in *[!a-zA-Z0-9_.:/,-]*) echo "::error::Refusing suspicious origin list"; exit 1 ;; esac
          cid="$(docker ps --filter 'name=_web' --filter 'status=running' --format '{{.ID}}' | head -1)"
          if [ -z "$cid" ]; then echo "::error::No running web container on this node"; exit 1; fi
          docker exec -e ORIGINS="${{ inputs.reachFromWeb }}" "$cid" node -e '
            const { lookup } = require("node:dns/promises");
            (async () => {
              for (const raw of (process.env.ORIGINS || "").split(",").map((s) => s.trim()).filter(Boolean)) {
                const origin = /^https?:\/\//.test(raw) ? raw : `http://${raw}`;
                let host = "?";
                try { host = new URL(origin).hostname } catch { console.log(`${raw}: not a URL`); continue }
                const legal = /^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)*$/i.test(host);
                let dns = "-";
                try { dns = (await lookup(host)).address } catch (e) { dns = `FAILED (${e.code || e.message})` }
                let http = "-";
                try {
                  const res = await fetch(origin, { method: "GET", signal: AbortSignal.timeout(8000) });
                  http = `HTTP ${res.status}`;
                } catch (e) { http = `FAILED (${e.cause?.code || e.code || e.message})` }
                console.log(`${host}\n  legal hostname : ${legal}${legal ? "" : "  <-- MinIO refuses this Host header"}\n  resolves to    : ${dns}\n  responds       : ${http}\n`);
              }
            })();
          '

      # The panel is LAN-internal — reachable from this runner over
      # dokploy-network and from nowhere else — so a deployment variable that
      # needs changing outside a deploy has no other auditable route. One
      # variable per run, named in the input and echoed into the log, because
      # the whole point of doing it here rather than by hand is that Actions
      # keeps the record of who changed what and when.
      #
      # The compose FILE is read back and returned verbatim rather than sent
      # from this checkout: an ops run is not a deploy, and it must not quietly
      # move the deployed compose to whatever main happens to hold.
      - name: Set one compose variable and redeploy
        if: ${{ inputs.setComposeEnv != '' }}
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
          PAIR: ${{ inputs.setComposeEnv }}
        run: |
          set -euo pipefail
          : "${DOKPLOY_URL:?DOKPLOY_URL secret is not set}"
          : "${COMPOSE_ID:?DOKPLOY_COMPOSE_ID secret is not set}"
          key="${PAIR%%=*}"
          value="${PAIR#*=}"
          case "$key" in ''|*[!A-Z0-9_]*) echo "::error::KEY must be A-Z, 0-9 and underscores"; exit 1 ;; esac
          case "$value" in ''|*'|'*) echo "::error::VALUE must be non-empty and contain no '|'"; exit 1 ;; esac

          base="${DOKPLOY_URL%/}"
          current="$(curl -sS --fail -H "x-api-key: $DOKPLOY_TOKEN" \
            -G "$base/api/compose.one" --data-urlencode "composeId=$COMPOSE_ID")"
          new_env="$(echo "$current" | jq -r '.env // ""')"
          compose_file="$(echo "$current" | jq -r '.composeFile // ""')"
          if [ -z "$compose_file" ]; then echo "::error::Dokploy returned no composeFile — refusing to write"; exit 1; fi

          before="$(printf '%s\n' "$new_env" | grep "^$key=" || echo '(not set)')"
          if printf '%s\n' "$new_env" | grep -q "^$key="; then
            new_env="$(printf '%s\n' "$new_env" | sed "s|^$key=.*|$key=$value|")"
          else
            new_env="$(printf '%s\n%s=%s\n' "$new_env" "$key" "$value")"
          fi
          echo "$key"
          echo "  before: $before"
          echo "  after : $key=$value"

          jq -n --arg id "$COMPOSE_ID" --arg env "$new_env" --arg composeFile "$compose_file" \
            '{composeId:$id, env:$env, composeFile:$composeFile}' \
            | curl -sS --fail -H "x-api-key: $DOKPLOY_TOKEN" \
                -H 'content-type: application/json' \
                -X POST "$base/api/compose.update" --data @- > /dev/null

          curl -sS --fail -H "x-api-key: $DOKPLOY_TOKEN" -H 'content-type: application/json' \
            -X POST "$base/api/compose.deploy" --data "{\"composeId\":\"$COMPOSE_ID\"}" > /dev/null
          echo "Redeploy triggered."

      # The runner binary is baked into the image and GitHub retires old
      # versions on a clock — a runner past the cutoff silently stops picking
      # up jobs, which for this repo means deploys queue forever. The recreate
      # is scheduled detached with a delay, because this job runs on the very
      # container being replaced: recreating it inline would kill the job that
      # asked for it, and the helper has to outlive us to finish the work.
      - name: Update the shared GitHub runners
        if: ${{ inputs.updateRunners }}
        run: |
          set -euo pipefail
          ctr="$(docker ps --format '{{.Names}}' | grep '^github-runners-' | head -1)"
          if [ -z "$ctr" ]; then echo "::error::No github-runners container on this host"; exit 1; fi
          proj="$(docker inspect "$ctr" --format '{{index .Config.Labels "com.docker.compose.project"}}')"
          wd="$(docker inspect "$ctr" --format '{{index .Config.Labels "com.docker.compose.project.working_dir"}}')"
          cfg="$(docker inspect "$ctr" --format '{{index .Config.Labels "com.docker.compose.project.config_files"}}')"
          img="$(docker inspect "$ctr" --format '{{.Config.Image}}')"
          if [ -z "$proj" ] || [ -z "$wd" ]; then
            echo "::error::$ctr carries no compose labels — cannot recreate what compose did not create"
            exit 1
          fi
          echo "compose project: $proj"
          echo "project dir    : $wd"
          echo "config files   : $cfg"
          echo "image          : $img"
          echo "::group::Runners before"
          docker ps --filter name=github-runners- --format '{{.Names}}  {{.Image}}  {{.Status}}'
          echo "::endgroup::"
          # A failed earlier attempt left its story in the helper's logs, and
          # nothing else on this host keeps that record.
          if docker inspect github-runners-update >/dev/null 2>&1; then
            echo "::group::Previous update helper output"
            docker logs github-runners-update 2>&1 | tail -40 || true
            echo "::endgroup::"
            docker rm -f github-runners-update >/dev/null 2>&1
          fi
          docker pull "$img"
          # The helper needs the compose plugin; find that out now, while a
          # failure still fails this step instead of a detached container.
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock docker:27-cli docker compose version
          args="-p $proj --project-directory $wd"
          mounts="-v /var/run/docker.sock:/var/run/docker.sock -v $wd:$wd:ro"
          seen_dirs=""
          IFS=','
          for f in $cfg; do
            args="$args -f $f"
            d="$(dirname "$f")"
            case ",$wd,$seen_dirs," in *",$d,"*) ;; *)
              mounts="$mounts -v $d:$d:ro"; seen_dirs="${seen_dirs:+$seen_dirs,}$d" ;;
            esac
          done
          unset IFS
          # shellcheck disable=SC2086 # $mounts and $args are deliberate word lists
          docker run -d --name github-runners-update $mounts docker:27-cli \
            sh -c "sleep 20 && docker compose $args up -d --force-recreate"
          echo "Recreate scheduled ~20s after this job ends. Every runner in '$proj'"
          echo "restarts on the freshly pulled image and re-registers itself."

      - name: Prune images, stopped containers, and build cache
        if: ${{ inputs.prune }}
        run: |
          set -uo pipefail
          docker container prune -f || true
          docker image prune -af || true
          docker builder prune -af || true

      - name: After
        if: ${{ inputs.prune || inputs.removeVolume != '' }}
        run: |
          set -uo pipefail
          df -h
          docker system df || true
