# Local mail lab: Mailpit catches and displays every message hands SEND
# (point a hand's SMTP at localhost:1025, watch http://localhost:8025);
# GreenMail provides accept-anything IMAP/SMTP so hands can be connected
# end-to-end with no real mail account (IMAP localhost:3143, SMTP :3025 —
# send test mail INTO a hand with any SMTP client against :3025).
# LiveKit is the voice/media plane (browser calls join rooms here; the
# voice agent worker registers against it). --dev mode fixes the API key
# pair to devkey/secret — matching LIVEKIT_* in .env.local.
# livekit-sip is the SIP ingress for the phone system: a tenant's PBX (or
# carrier) points a SIP trunk at <docker-host>:5060 (UDP/TCP); inbound calls
# become LiveKit rooms via the dispatch rules the app provisions. The SIP
# service and the LiveKit server coordinate over Redis, so both attach to
# the dedicated media-redis below (media infrastructure only — the shared
# application Redis at 10.0.0.90 is intentionally NOT used here). No new
# .env entries are needed: the app reaches SIP provisioning through the
# existing LIVEKIT_URL/LIVEKIT_API_KEY/LIVEKIT_API_SECRET. When deploying
# beyond the LAN, announce the host's public address to remote SIP peers by
# adding `use_external_ip: true` (or `nat_1_to_1_ip: <public-ip>`) to
# SIP_CONFIG_BODY and widening the RTP range.
services:
  livekit:
    image: livekit/livekit-server:latest
    container_name: bunkhouse-livekit
    restart: unless-stopped
    command: '--dev --bind 0.0.0.0 --redis-host media-redis:6379'
    depends_on:
      - media-redis
    ports:
      - '7880:7880'
      - '7881:7881'
      - '7882:7882/udp'

  # Dedicated Redis for the media plane (LiveKit server ↔ SIP RPC bus).
  # Published on 6390 locally so it never collides with an app Redis.
  media-redis:
    image: redis:7-alpine
    container_name: bunkhouse-media-redis
    restart: unless-stopped
    ports:
      - '6390:6379'

  livekit-sip:
    image: livekit/sip:latest
    container_name: bunkhouse-livekit-sip
    restart: unless-stopped
    depends_on:
      - livekit
      - media-redis
    environment:
      SIP_CONFIG_BODY: |
        api_key: devkey
        api_secret: secret
        ws_url: ws://livekit:7880
        redis:
          address: media-redis:6379
        sip_port: 5060
        rtp_port: 10000-10100
        logging:
          level: info
    ports:
      - '5060:5060/udp'
      - '5060:5060/tcp'
      - '10000-10100:10000-10100/udp'

  # Object storage for the files ledger (agent deliverables, mail attachments).
  # The app reaches it through APPKIT_STORAGE_* in .env.local; the console at
  # http://localhost:9001 (minioadmin/minioadmin) is for poking around locally.
  minio:
    image: minio/minio:latest
    container_name: bunkhouse-minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: bunkhouse-mailpit
    restart: unless-stopped
    ports:
      - '8025:8025'
      - '1025:1025'
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  greenmail:
    image: greenmail/standalone:latest
    container_name: bunkhouse-greenmail
    restart: unless-stopped
    ports:
      - '3025:3025'
      - '3143:3143'
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled

volumes:
  minio-data:
