# The quickstart: everything Bunkhouse needs to run, from one command. It uses
# the published release image so first contact does not compile the monorepo.
#
#   docker compose up -d
#
# Then open http://localhost:4810 and sign in with ADMIN_EMAIL/ADMIN_PASSWORD
# (defaults below — override them in your shell or a .env file, and rotate the
# first-boot credential after sign-in). Data lives in named volumes; `docker
# compose down -v` erases it, which is the point of a quickstart.
#
# This file is for evaluation on one machine. It is NOT the deployment shape:
# secrets default in plain sight here so that first contact is one command.
# For anything reachable by another person, see deploy/dokploy.compose.yaml
# and SECURITY.md.
#
# What is bundled: PostgreSQL 16 (with the two-role RLS posture the app is
# designed for), Redis 7, the web app, and the background worker.
# What is not: object storage (point APPKIT_STORAGE_* at any S3-compatible
# service to enable real file deliverables), the mail/media lab
# (docker-compose.dev.yml), and the voice agent (needs LiveKit — same file).
#
# The agent desk (the per-agent microVM) is opt-in via a profile, because it
# needs /dev/kvm. On a Linux host that has it:
#
#   docker compose --profile desk up -d
#
# See the desk-runner service below for what happens everywhere else.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bunkhouse
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/quickstart-init.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d bunkhouse']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data

  web:
    image: ${BUNKHOUSE_IMAGE:-ghcr.io/braedonsaunders/bunkhouse:latest}
    pull_policy: always
    ports:
      - '4810:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment: &app-env
      APP_URL: http://localhost:4810
      BUNKHOUSE_DB_URL: postgresql://bunkhouse_app:bunkhouse@postgres:5432/bunkhouse
      BUNKHOUSE_SUPER_URL: postgresql://bunkhouse_super:bunkhouse@postgres:5432/bunkhouse
      BUNKHOUSE_REDIS_URL: redis://redis:6379
      ADMIN_EMAIL: ${ADMIN_EMAIL:-owner@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-bunkhouse-first-boot}
      # The desk runner, when the `desk` profile is up (Linux hosts with
      # /dev/kvm). Without the profile nothing answers at this address and the
      # desk abilities fail closed — deliberately, see the desk-runner service.
      BUNKHOUSE_DESK_URL: http://desk-runner:8080
      BUNKHOUSE_DESK_TOKEN: ${BUNKHOUSE_DESK_TOKEN:-quickstart-only-not-a-secret-change-me-3}
      BUNKHOUSE_REMOTE_GATEWAY_URL: http://remote-gateway:8090
      BUNKHOUSE_REMOTE_GATEWAY_TOKEN: ${BUNKHOUSE_REMOTE_GATEWAY_TOKEN:-quickstart-only-not-a-secret-change-me-4}
      # Local-evaluation defaults. Generate real ones for anything shared.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-quickstart-only-not-a-secret-change-me-1}
      APPKIT_SECRET: ${APPKIT_SECRET:-quickstart-only-not-a-secret-change-me-2}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  worker:
    image: ${BUNKHOUSE_IMAGE:-ghcr.io/braedonsaunders/bunkhouse:latest}
    pull_policy: always
    command: ['apps/web/node_modules/.bin/tsx', 'apps/web/scripts/worker.mts']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      <<: *app-env
      NODE_OPTIONS: '--conditions=react-server'

  guacd:
    image: guacamole/guacd:1.6.0
    restart: unless-stopped

  remote-gateway:
    image: ${BUNKHOUSE_IMAGE:-ghcr.io/braedonsaunders/bunkhouse:latest}
    pull_policy: always
    command: ['apps/web/node_modules/.bin/tsx', 'apps/web/scripts/remote-gateway.mts']
    depends_on:
      guacd:
        condition: service_started
    ports:
      - '8091:8091'
    environment:
      PORT: '8090'
      BUNKHOUSE_REMOTE_BRIDGE_PORT: '8091'
      BUNKHOUSE_REMOTE_GATEWAY_PUBLIC_URL: ws://localhost:8091
      BUNKHOUSE_REMOTE_GATEWAY_TOKEN: ${BUNKHOUSE_REMOTE_GATEWAY_TOKEN:-quickstart-only-not-a-secret-change-me-4}
      BUNKHOUSE_REMOTE_CIPHER_KEY: ${BUNKHOUSE_REMOTE_CIPHER_KEY:-cXVpY2tzdGFydC1yZW1vdGUtY2lwaGVyLWtleSEhISE=}
      GUACD_HOST: guacd

  # The agent desk: one Cloud Hypervisor microVM per agent.
  #
  # Opt-in via `docker compose --profile desk up` because it requires /dev/kvm:
  #   - On a Linux host, /dev/kvm is usually present and passes straight into
  #     the container — the full product lights up.
  #   - Docker Desktop on macOS and Windows cannot pass the device through. The
  #     service then fails to start (or fails its healthcheck and exits), and
  #     the product runs without the machine — fail closed, with the desk
  #     abilities simply not offered, exactly as it already behaves without
  #     Chromium on the box.
  # Deliberately NO software-emulation (TCG) fallback: an emulated desktop is
  # slow enough to misrepresent the product worse than omitting it.
  desk-runner:
    profiles: ['desk']
    image: ${BUNKHOUSE_IMAGE:-ghcr.io/braedonsaunders/bunkhouse:latest}
    pull_policy: always
    command:
      - sh
      - -c
      - NODE_OPTIONS=--conditions=react-server exec apps/web/node_modules/.bin/tsx apps/web/scripts/desk-runner.mts
    devices:
      - /dev/kvm
    environment:
      PORT: '8080'
      BUNKHOUSE_DESK_TOKEN: ${BUNKHOUSE_DESK_TOKEN:-quickstart-only-not-a-secret-change-me-3}
      BUNKHOUSE_AGENT_DISKS: /data/agent-disks
      BUNKHOUSE_SHARED_FOLDER: /data/shared
      BUNKHOUSE_EGRESS_PROXY: http://egress-proxy:3128
    volumes:
      - agent-disks:/data/agent-disks
      - shared-folder:/data/shared
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Every byte a desk guest sends is DNAT'd into this proxy at the TAP device
  # by the desk-runner — enforcement lives outside the guest by design.
  egress-proxy:
    profiles: ['desk']
    image: ${BUNKHOUSE_IMAGE:-ghcr.io/braedonsaunders/bunkhouse:latest}
    pull_policy: always
    command:
      - sh
      - -c
      - NODE_OPTIONS=--conditions=react-server exec apps/web/node_modules/.bin/tsx apps/web/scripts/egress-proxy.mts
    environment:
      PORT: '3128'

volumes:
  pgdata:
  redisdata:
  # Desk state (golden base image + per-agent CoW overlays); profile `desk`.
  agent-disks:
  shared-folder:
